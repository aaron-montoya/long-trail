<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Long Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #e9eef1; --bg2: #dde5ea; --panel: #f7f9fa; --line: #c3ced5; --fg: #1d2a33; --muted: #5d6d78;
  --accent: #b5381f; --accent-fg: #fff; --good: #2f7a47; --bad: #a3321c; --sys: #6a5a9c;
  --card: #f3e8d2; --card2: #e8d8b8; --ink: #3b2a1e; --ink-soft: #6e5640; --cardline: #b89a72;
  --back: #31455a; --back2: #22323f; --hl: #f2b632; --shadow: 0 1px 2px rgba(20,30,40,.18), 0 3px 10px rgba(20,30,40,.10);
  --p0: #c0392b; --p1: #2e6da4; --p2: #3d8b4f; --p3: #c58b12;
  --lead: #2e6da4; --team: #3d8b4f; --wheel: #8a5a2b;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f161d; --bg2: #16212b; --panel: #18242f; --line: #2c3c49; --fg: #e3eaef; --muted: #93a4b1;
  --accent: #e0623f; --accent-fg: #1a0f0a; --good: #6cc78b; --bad: #f08a6e; --sys: #b3a6e6;
  --back: #3a5268; --back2: #26394a; --hl: #f2b632; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.35);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f161d; --bg2: #16212b; --panel: #18242f; --line: #2c3c49; --fg: #e3eaef; --muted: #93a4b1;
  --accent: #e0623f; --accent-fg: #1a0f0a; --good: #6cc78b; --bad: #f08a6e; --sys: #b3a6e6;
  --back: #3a5268; --back2: #26394a; --hl: #f2b632; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.35);
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 "Source Sans 3", system-ui, sans-serif; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 32px; max-width: 1400px; margin: 0 auto; }
h1, h2, h3 { font-family: Bitter, Georgia, serif; text-wrap: balance; margin: 0; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 7px 12px; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
button.ghost { background: transparent; }
.small { font-size: 13px; color: var(--muted); }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* header */
.top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.top h1 { font-size: 22px; letter-spacing: .02em; }
.top h1 span { color: var(--accent); }
.top .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.clock { font-variant-numeric: tabular-nums; font-size: 15px; align-self: center; padding: 0 4px; }
.clock b { font-family: Bitter, Georgia, serif; font-size: 18px; }
.top .tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

/* cards */
:root { --handw: 150px; --stripw: 96px; }
.card { --w: 104px; width: var(--w); aspect-ratio: 63 / 88; max-width: 100%; border-radius: calc(var(--w) * .07); background: var(--card); color: var(--ink);
  border: 1px solid var(--cardline); box-shadow: var(--shadow); position: relative; overflow: hidden; flex: none;
  font-size: calc(var(--w) * .095); line-height: 1.15; display: flex; flex-direction: column; user-select: none; }
.card img.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .ct { font-family: Bitter, Georgia, serif; font-weight: 800; font-size: 1.12em; padding: .45em .5em .1em; letter-spacing: .01em; }
.card .cs { padding: 0 .55em; color: var(--ink-soft); font-size: .82em; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.card .cx { padding: .35em .55em; font-size: .86em; flex: 1; overflow: hidden; }
.card .big { font-family: Bitter, Georgia, serif; font-weight: 800; font-size: 2.6em; line-height: 1; }
.card .band { height: .5em; flex: none; }
.card.back { background: repeating-linear-gradient(135deg, var(--back) 0 6px, var(--back2) 6px 12px); border-color: var(--back2); color: #e9eef1; align-items: center; justify-content: center; text-align: center; }
.card.back .bt { font-family: Bitter, Georgia, serif; font-weight: 800; font-size: 1.05em; letter-spacing: .12em; background: var(--back2); padding: .3em .45em; border-radius: .3em; }
.card.dog .band.Lead { background: var(--lead); } .card.dog .band.Team { background: var(--team); } .card.dog .band.Wheel { background: var(--wheel); }
.dogspeed { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 .55em .45em; }
.dogspeed .tiredv { font-weight: 700; font-size: .9em; color: var(--ink-soft); }
.card.gear .band { background: #8b6b3d; } .card.event .band { background: #4b5d73; } .card.musher .band { background: var(--accent); }
.card.trail .band { background: #6f8796; }
.card.trail .tc { position: absolute; right: .35em; top: .25em; font-family: Bitter, serif; font-weight: 800; font-size: 2em; }
.card.cp { background: #e6dcc5; } .card.cp .band, .card.finish .band { background: var(--accent); }
.rew { display: inline-block; font-size: .8em; font-weight: 700; padding: .1em .35em; border-radius: .3em; background: var(--ink); color: var(--card); margin: 0 .55em .4em; }
.card .stateflag { position: absolute; left: 50%; bottom: .4em; transform: translateX(-50%); background: var(--ink); color: var(--card); font-size: .8em; padding: .1em .45em; border-radius: 1em; font-weight: 700; white-space: nowrap; }
.card .stateflag.top { left: auto; right: .35em; bottom: auto; top: .35em; transform: none; }
.card.sel { outline: 3px solid var(--hl); outline-offset: 2px; }
.card.pick { cursor: pointer; }
.card.pick:hover { transform: translateY(-3px); }
.card.dim { opacity: .45; }
.card.tired-art img.art { transform: rotate(180deg); }
.card.tired-txt { background: var(--card2); }
.exhwrap { width: calc(var(--w, 104px) * 1.397); height: var(--w, 104px); position: relative; flex: none; }
.exhwrap .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(90deg); }
.exhwrap .card .ct, .exhwrap .card .cx, .exhwrap .card .cs, .exhwrap .card .dogspeed { visibility: visible; }
.order { position: absolute; top: .3em; right: .3em; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--hl); color: #2a1c0a; font-weight: 800; display: grid; place-items: center; font-size: 1em; z-index: 3; }

/* trail strip */
.stripbox { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; overflow-x: auto; }
.strip { display: flex; gap: 8px; align-items: flex-start; min-width: max-content; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 4px; width: calc(var(--stripw) + 4px); flex: none; }
.slot .card { --w: var(--stripw); }
.tokens { display: flex; gap: 3px; height: 24px; flex-wrap: wrap; justify-content: center; }
.tok { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px; border: 2px solid rgba(255,255,255,.8); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.slotlab { font-size: 11.5px; color: var(--muted); font-weight: 600; text-align: center; }
.slot.proj .card { outline: 3px dashed var(--hl); outline-offset: 2px; }
.slot.projend .card { outline: 3px solid var(--hl); outline-offset: 2px; }
.slot .rewmini { --w: calc(var(--stripw) * .7); margin-top: -2px; }
.board .card { --w: var(--handw); }
[data-zoom] { cursor: zoom-in; }
.card.pick { cursor: pointer; }
.zoomb { position: absolute; left: .3em; top: .3em; z-index: 4; width: 2.1em; height: 2.1em; min-width: 26px; min-height: 26px; padding: 0; border-radius: 50%; font-size: max(12px, .9em); line-height: 1; background: rgba(255,255,255,.85); color: #2a1c0a; border: 1px solid rgba(0,0,0,.25); display: grid; place-items: center; }
.zoomview { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.zoomview .card { --w: min(340px, 78vw); cursor: default; }
.zoomview .zt { flex: 1 1 220px; min-width: 0; }
.zoomview .zt h3 { font-size: 24px; }
.zoomview .zt p { margin: 8px 0 0; max-width: 46ch; }
.sizer { display: inline-flex; }
.startcard { width: 70px; height: 122px; border: 2px dashed var(--line); border-radius: 8px; display: grid; place-items: center; color: var(--muted); font-family: Bitter, serif; font-weight: 700; }

/* players */
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin: 10px 0; }
.pl { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--pc); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.pl.now { box-shadow: 0 0 0 2px var(--hl); }
.pl.out { opacity: .55; }
.pl .nm { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.pl .nm b { font-family: Bitter, serif; font-size: 16px; }
.pl .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); white-space: nowrap; }
.chip.warn { border-color: var(--bad); color: var(--bad); }
.chip.ok { border-color: var(--good); color: var(--good); }
.pl .last { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

/* main area */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 500px; gap: 10px; align-items: start; }
.rail { display: flex; flex-direction: column; gap: 10px; position: sticky; top: max(8px, env(safe-area-inset-top, 0px)); min-width: 0; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } .rail { position: static; } }
.board, .logbox, .runpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.board h2 { font-size: 18px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; margin-top: 6px; }
.musherrow { display: flex; gap: 12px; align-items: flex-start; }
.board .musherrow > .card { --w: calc(var(--handw) * .72); }
.mtext { font-size: 14px; max-width: 52ch; min-width: 0; }
.mtext .side { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); margin-top: 4px; }
.mtext .side.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.mtext .side.off { opacity: .6; }
.waiting { padding: 18px; text-align: center; color: var(--muted); }

/* in front of you */
.tableau { margin-top: 12px; padding: 10px; border-radius: 10px; background: var(--bg2); border: 1px dashed var(--line); display: flex; gap: 16px; flex-wrap: wrap; min-height: 60px; }
.tableau .tz { min-width: 0; }
.tableau .tz .row { margin-top: 4px; }
.board .tableau .card { --w: calc(var(--handw) * .8); }
.tableau .empty { color: var(--muted); font-size: 13.5px; align-self: center; }

/* the hand */
.handzone { margin-top: 14px; }
.hand { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; align-items: flex-start; padding: 8px 0 4px; }
.hc { position: relative; flex: none; transition: transform .12s ease; }
.hc.gap { margin-left: 14px; }
.hc:hover, .hc:focus-within { transform: translateY(-4px); }
.hc.inline .card { opacity: .45; }
.hc .usebtn { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5; font-size: 13px; padding: 4px 12px; font-weight: 700; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.hand .empty { color: var(--muted); align-self: center; }
@media (prefers-reduced-motion: reduce) { .hc { transition: none; } }

/* run panel (right rail) */
.runpanel h3 { font-size: 17px; }
.acts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.acts .act { text-align: left; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.acts .act b { font-family: Bitter, serif; font-size: 16px; }
.acts .act span { font-size: 12.5px; color: var(--muted); }
.acts .act.primary span { color: inherit; opacity: .85; }
.acts label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
.notes { font-size: 13px; color: var(--muted); margin-top: 8px; }
.lineend { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; text-align: center; padding: 4px 0; }
.runlist { display: flex; flex-direction: column; gap: 6px; }
.rs { display: grid; grid-template-columns: 22px 52px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); }
.rs.dragging { opacity: .4; }
.rs.over { border-color: var(--hl); box-shadow: 0 0 0 2px var(--hl) inset; }
.rs .num { width: 22px; height: 22px; border-radius: 50%; background: var(--hl); color: #2a1c0a; font-weight: 800; display: grid; place-items: center; font-size: 12px; }
.rs .card { --w: 52px; box-shadow: none; }
.rs .who { min-width: 0; font-size: 13px; line-height: 1.25; }
.rs .who b { font-family: Bitter, serif; font-size: 15px; }
.rs .who .plus { color: var(--good); font-weight: 700; }
.rs .ctl { display: flex; gap: 3px; }
.rs .ctl button { padding: 3px 7px; font-size: 13px; }
.rs[draggable="true"] { cursor: grab; }
.emptyline { border: 2px dashed var(--line); border-radius: 10px; padding: 16px 10px; text-align: center; color: var(--muted); font-size: 13.5px; }
.rungear { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
.rungear label { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
.rungear label small { color: var(--muted); display: block; }
.proj { font-size: 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.proj .spd { font-family: Bitter, serif; font-size: 30px; font-weight: 800; line-height: 1; }
.breakdown { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.summary { margin: 8px 0 10px; padding: 12px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); }
.summary .vs { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: start; margin-top: 6px; }
.summary .verdict { align-self: center; }
.summary .k { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.summary .big { font-family: Bitter, serif; font-weight: 800; font-size: 42px; line-height: 1; }
.summary .big.ok { color: var(--good); } .summary .big.short { color: var(--bad); }
.summary .verdict { font-weight: 800; font-size: 15px; padding-bottom: 6px; }
.summary .verdict .ok { color: var(--good); } .summary .verdict .short { color: var(--bad); }
.chips2 { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chips2 s { opacity: .6; }
.sumafter { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; }
.sumafter b { font-family: Bitter, serif; }
.warn { color: var(--bad); font-weight: 700; margin-top: 4px; font-size: 13.5px; }
.gearpills { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.gearpills label { display: flex; gap: 8px; align-items: center; font-size: 13.5px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
.gearpills label.on { border-color: var(--hl); background: color-mix(in srgb, var(--hl) 14%, transparent); }
.gearpills small { color: var(--muted); }
.target { margin: 8px 0 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); }
.target .trow { display: flex; gap: 12px; align-items: center; margin-top: 2px; }
.target .tbig { font-family: Bitter, serif; font-weight: 800; font-size: 40px; line-height: 1; min-width: 1.4ch; text-align: center; }
.target .tnotes { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
.tchip { display: inline-block; font-size: 12.5px; padding: 1px 8px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); }
.tchip.plus { border-color: var(--good); color: var(--good); margin-left: 4px; }
.target .tneed { font-size: 14px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.target .tneed b { font-family: Bitter, serif; font-size: 18px; margin: 0 2px; }
.target .tstat { margin-top: 6px; font-weight: 700; font-size: 14px; }
.target .ok { color: var(--good); } .target .short { color: var(--bad); }
.breakdown.steps { color: var(--fg); padding: 6px 8px; border-radius: 8px; background: var(--bg2); }
.breakdown.steps b { font-family: Bitter, serif; }
.runbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.runbtns .primary { flex: 1 1 100%; font-size: 17px; padding: 10px; }

.logbox { margin-top: 10px; }
.logbox summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; }
.logbox summary::-webkit-details-marker { display: none; }
.logbox summary::before { content: "▸"; color: var(--muted); }
.logbox[open] summary::before { content: "▾"; }
.logbox summary .small { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logbox[open] summary .small { display: none; }
.log { overflow-y: auto; font-size: 13.5px; max-height: 280px; margin-top: 6px; }
.zzbox { position: relative; margin: 4px auto; max-width: 100%; }
.zz { position: absolute; width: calc(var(--zw) + var(--side)); display: flex; gap: 4px; align-items: center; }
.zz.l { flex-direction: row-reverse; }
.zz.r { flex-direction: row; }
.zz .card { --w: var(--zw); }
.zz.dragging { opacity: .35; }
.zz.over .card { outline: 3px solid var(--hl); outline-offset: 2px; }
.zz[draggable="true"] { cursor: grab; }
.zzspd { background: var(--good); color: #fff; font-weight: 800; font-size: 12.5px; padding: 1px 0; border-radius: 10px; text-align: center; width: 30px; }
.zznum { width: 30px; height: 24px; border-radius: 12px; background: var(--hl); color: #2a1c0a; font-weight: 800; display: grid; place-items: center; font-size: 13px; }
.zzctl { display: flex; flex-direction: column; gap: 3px; width: 30px; flex: none; }
.zzctl button { padding: 3px 0; font-size: 12px; width: 30px; }
.log div { padding: 2px 0; border-bottom: 1px dotted var(--line); }
.log .round { font-family: Bitter, serif; font-weight: 700; color: var(--fg); border-bottom: 1px solid var(--line); padding-top: 8px; }
.log .ev { color: var(--sys); } .log .good { color: var(--good); } .log .bad { color: var(--bad); } .log .win { color: var(--accent); font-weight: 700; }
.log .act { color: var(--fg); } .log .sys { color: var(--muted); font-style: italic; }
.log .fresh { background: color-mix(in srgb, var(--hl) 22%, transparent); }

.times { border-collapse: collapse; font-size: 14px; margin: 6px 0; }
.times th, .times td { text-align: left; padding: 3px 12px 3px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.times th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.menubtn { display: none; }
.mobilebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; gap: 6px; align-items: center;
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(0,0,0,.18); }
.mobilebar button { flex: 1 1 0; padding: 11px 6px; font-weight: 700; font-size: 15px; }
.mobilebar .mbsum { flex: 2 1 0; display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.mobilebar .mbsum b { font-family: Bitter, serif; font-size: 20px; color: var(--fg); }
.mobilebar .mbsum b.ok { color: var(--good); } .mobilebar .mbsum b.short { color: var(--bad); }
.mobilebar .mbv { font-weight: 700; font-size: 12.5px; }
.mobilebar .mbv .ok { color: var(--good); } .mobilebar .mbv .short { color: var(--bad); }

<script>
/* Long Trail — rules engine + bots (no DOM). */
const LT = (() => {
  // ---------------- Card data ----------------
  const DOGS = [

  const GEAR = [

    ["Dog Food", 3, "free", "Return one exhausted dog to your hand."],

    ["Bivy Sack", 3, "camp", "Play when you camp in the open: draw no Event."],
    ["Wax the Runners", 2, "run", "Every trail has 1 less Difficulty this Run (minimum 1)."],
    ["Whistle", 2, "free", "Return one tired dog to your hand."],
    ["Hot Broth", 2, "free", "Return all your tired dogs to your hand."],

  ];
  const GEAR_INFO = Object.fromEntries(GEAR.map(g => [g[0], { when: g[2], text: g[3] }]));

  const TRAILS = [
    ["Snowfield", 6, null], ["Snowfield", 6, "gear"], ["Snowfield", 7, null], ["Snowfield", 7, null], ["Snowfield", 7, "gear"],
    ["River Ice", 6, "gear"], ["River Ice", 7, "gear"], ["River Ice", 7, "dog"],
    ["Spruce Forest", 7, null], ["Spruce Forest", 8, "gear"], ["Spruce Forest", 8, null],
    ["Exposed Ridge", 7, "gear"], ["Exposed Ridge", 8, "dog"], ["Exposed Ridge", 8, "gear"],
    ["Deep Powder", 9, "gear"], ["Deep Powder", 9, null], ["Deep Powder", 10, null],
    ["Mountain Pass", 9, "dog"], ["Mountain Pass", 9, "gear"], ["Mountain Pass", 10, "gear"],
  ];
  const TERRAIN = {
    "Snowfield": "",
    "Starting Chute": "",
    "River Ice": "If 3 or more dogs run onto this trail, draw 1 Event.",
    "Spruce Forest": "When you camp here, draw no Event.",
    "Exposed Ridge": "If you end your turn here, draw 1 Event.",
    "Deep Powder": "Drafting saves 3 here instead of 1.",
    "Mountain Pass": "Rested Wheel dogs count their Speed twice."
  };
  const CP_TEXT = "Camp here once to draw 1 dog and take 1 gear. Draw no Event. Long rest to draw 2 dogs and keep 1, draw 2 gear and keep 1, all used gear returns, then skip a turn. Draw no Event.";
  const FINISH_TEXT = "The first Musher to reach the Finish wins!";

  const EVENTS = [
    ["Clear Skies", 2, "No effect."],
    ["Northern Lights", 1, "Keep this card. Your next Run gets +2 Speed, then discard it."],
    ["Tailwind", 2, "Keep this card. Your next Run gets +1 Speed, then discard it."],
    ["Fresh Snow", 2, "Keep this card. On your next Run, every trail has 1 more Difficulty. Then discard this card."],
    ["Bitter Cold", 8, "Drop one dog, tired or exhausted first."],
    ["Blizzard", 3, "Drop one dog, tired or exhausted first. Then move back one trail, but never past a checkpoint."],
    ["Moose on the Trail", 2, "A moose blocks the way. One tired dog becomes exhausted. If you have none, move back one trail."],
    ["Squirrel!", 1, "A tired or exhausted dog chases a squirrel all the way home. Drop it, unless you have a rested Wheel dog in your hand."],
    ["Whiteout", 2, "Drop one tired or exhausted dog. Skip your next turn. Turn your musher sideways as a reminder."],
    ["Sore Paws", 2, "One of your tired dogs becomes exhausted."],
    ["Steep Climb", 1, "All your tired dogs become exhausted."],
    ["Lost Bootie", 1, "Put one gear from your hand on the bottom of the Gear deck."],
  ];
  // Gangline mode (prototype): one Event every turn, aimed at the team on the table.
  const G_EVENTS = [
    ["Deep Snow", 4, "Your Lead dog becomes tired."],
    ["Long Climb", 3, "Every rested Team dog in your line becomes tired."],
    ["Cold Snap", 4, "One tired dog in your line becomes exhausted."],
    ["Steep Climb", 1, "Every tired dog in your line becomes exhausted."],
    ["Tangled Lines", 2, "Move your Lead dog to the back of your line."],
    ["Bitter Cold", 4, "Drop an exhausted dog. If you have none, one tired dog becomes exhausted."],
    ["Blizzard", 2, "Drop an exhausted dog. Then move back one trail, but never past a checkpoint."],
    ["Whiteout", 1, "You can't Go on your next turn."],
    ["Second Wind", 2, "One tired dog in your line becomes rested."],
    ["Tailwind", 2, "Keep this card. Your next Go gets +2 Speed, then discard it."],
    ["Clear Skies", 2, "No effect."],
  ];
  const EVENT_TEXT = Object.fromEntries(EVENTS.map(e => [e[0], e[2]]));
  // Gangline mode: cards whose printed text doesn't match how they work in this format.
  // The game shows these as text cards (no art) with this wording instead.
  const G_ALT = {
    dog: {
      "Chappell": ["", "If Chappell is tired at the front and would tire again, he returns to your hand instead."],
      "Jim Bucket": ["+1 for each other dog in your line that isn't exhausted.", ""],
      "Anvil": ["+2 if 4 or more dogs in your line aren't exhausted.", ""],
      "Boulder": ["While Boulder is rested, in your hand or your line, Events can't move you back a trail.", ""],
    },
    gear: {
      "Booties": "Your Lead dog doesn't tire on this Go.",
      "Dog Food": "One exhausted dog becomes rested.",
      "Whistle": "One tired dog becomes rested.",
      "Hot Broth": "All your tired dogs become rested.",
    },
    musher: {
      "Veteran": ["No ability in Gangline (there's no Slog).", "Final-leg trails have 1 less Difficulty for you."],
    },
    noGear: ["Red Lantern"], // nothing to do without Slog
  };
  const G_START = { name: "Starting Chute", cost: 3 };
  const G_EVENT_TEXT = Object.fromEntries(G_EVENTS.map(e => [e[0], e[2]]));
  const HARSH = {
    "Northern Lights": 0, "Tailwind": 0, "Clear Skies": 1, "Fresh Snow": 3, "Lost Bootie": 3, "Sore Paws": 4,
    "Moose on the Trail": 5, "Steep Climb": 5, "Whiteout": 6, "Bitter Cold": 7, "Squirrel!": 7, "Blizzard": 8,
  };

  const MUSHERS = {
    "Sprinter": ["Every Run gets +2 Speed.", "Every Run gets +1 Speed."],
    "Champion": ["Your Lead bonus is +2.", "Every Run gets +2 Speed."],
    "Trailbreaker": ["Trails no musher has reached yet have 2 less Difficulty for you.", "Trails no musher has reached yet have 1 less Difficulty for you. When you take a trail reward, also take the top Gear card."],
    "Rookie": ["Once per leg, ignore an Event you draw.", "Every Run gets +1 Speed."],
    "Night Runner": ["Your first Run after camping gets +4 Speed.", "Your first Run after camping gets +3 Speed. Camping in the open makes you draw no Event."],
    "Veteran": ["Slogging never makes you draw an Event.", "Final-leg trails have 1 less Difficulty for you."],
    "Gambler": ["Whenever you draw an Event, draw 2 and choose 1.", "Each tired dog you push gets +1 Speed."],
    "Trapper": ["When you draw dogs at a checkpoint, including your Long Rest, draw 3 extra and choose which to keep. When you take a trail reward, also take the top card of the Dog deck.", "When you take a trail reward or camp in the open, also take the top card of the Dog deck."],
  };
  const MUSHER_NAMES = Object.keys(MUSHERS);
  const FINISH_COST = 2;
  const UNKNOWN_COST = 7.75;

  // ---------------- RNG ----------------
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let uid = 0;
  const nid = (k) => k + (++uid);

  // ---------------- Game ----------------
  class Game {
    constructor(opts) {
      uid = 0; // card ids depend only on the seed, so a saved race replays the same way
      this.io = opts.io || {};
      this.seed = opts.seed ?? Math.floor(Math.random() * 1e9);
      this.mode = opts.mode || "standard";
      this.format = opts.format === "gangline" ? "gangline" : "classic";
      this.rules = opts.rules || {};
      this.r = rng(this.seed);
      this.round = 0;
      this.turnIdx = 0;
      this.winner = null;
      this.over = false;
      this.logLines = [];
      this.stats = { events: 0, removed: 0 };

      const trails = TRAILS.map(t => ({ id: nid("t"), type: "T", name: t[0], cost: t[1], rtype: t[2], up: false, reward: null }));
      this.shuffle(trails);
      const legs = (opts.legs && opts.legs.length === 3 ? opts.legs : [1, 2, 4]).map(n => Math.max(1, Math.min(8, n | 0)));
      while (legs.reduce((x, y) => x + y, 0) > trails.length) legs[legs.indexOf(Math.max(...legs))]--;
      this.legs = legs;
      this.path = [];
      let k = 0;
      legs.forEach((n, li) => {
        for (let i = 0; i < n; i++) this.path.push(trails[k++]);
        if (li < 2) this.path.push({ id: nid("c"), type: "CP", cp: li + 1 });
      });
      this.path.push({ id: nid("f"), type: "F", cost: FINISH_COST });
      // Gangline: Trail 1 is always the Starting Chute, Difficulty 3.
      if (this.format === "gangline") this.path[0] = { id: nid("t"), type: "T", name: G_START.name, cost: G_START.cost, rtype: null, up: false, reward: null, start: true };
      this.cpIdx = this.path.map((c, i) => c.type === "CP" ? i : -1).filter(i => i >= 0);

      this.dogDeck = this.shuffle(DOGS.map(d => ({ id: nid("d"), name: d[0], role: d[1], rs: d[2], ts: d[3], ab: d[4], text: d[5], tt: d[6] || "", state: "rested", hardyUsed: false })));
      this.gearDeck = this.shuffle(GEAR.flatMap(g => Array.from({ length: g[1] }, () => ({ id: nid("g"), name: g[0], when: g[2], text: g[3] }))));
      if (this.format === "gangline") {
        this.gearDeck = this.gearDeck.filter(g => !G_ALT.noGear.includes(g.name));
        for (const d of this.dogDeck) { const a = G_ALT.dog[d.name]; if (a) { d.text = a[0]; d.tt = a[1]; d.gAlt = true; } }
        for (const g of this.gearDeck) { const a = G_ALT.gear[g.name]; if (a) { g.text = a; g.gAlt = true; } }
      }
      this.eventDeck = this.shuffle((this.format === "gangline" ? G_EVENTS : EVENTS).flatMap(e => Array.from({ length: opts.eventCounts && opts.eventCounts[e[0]] != null ? opts.eventCounts[e[0]] : e[1] }, () => e[0])));
      this.eventDiscard = [];

      const pool = this.shuffle(MUSHER_NAMES.slice());
      this.players = opts.players.map((pd, i) => {
        let m = pd.musher && pd.musher !== "Random" ? pd.musher : null;
        if (m) pool.splice(pool.indexOf(m), 1);
        return { idx: i, name: pd.name || `Player ${i + 1}`, bot: !!pd.bot, musher: m, color: pd.color,
          dogs: [], gear: [], used: [], lost: [], pos: -1, camped: new Set(), longRested: false,
          skip: 0, flipAfterSkip: false, after: false, runBonus: 0, costMod: 0, keptEvents: [],
          campedLast: false, scratched: false, slogLegs: new Set(), rookieLegs: new Set(), ignoreLeft: 0,
          shadowTurn: false, turns: 0, line: [], noGo: false, hitched: false };
      });
      this.players.forEach(p => { if (!p.musher) p.musher = pool.pop(); });
      // Carry-over: kept cards come out of the decks before anything is dealt.
      opts.players.forEach((pd, i) => {
        const p = this.players[i], k = pd.kept || {};
        p.keptStart = [];
        for (const n of (k.dogs || []).slice(0, 3)) {
          const j = this.dogDeck.findIndex(d => d.name === n);
          if (j >= 0) { const d = this.dogDeck.splice(j, 1)[0]; p.dogs.push(d); p.keptStart.push(d.name); }
        }
        for (const n of (k.gear || []).slice(0, 1)) {
          const j = this.gearDeck.findIndex(g => g.name === n);
          if (j >= 0) { const g = this.gearDeck.splice(j, 1)[0]; p.gear.push(g); p.keptStart.push(g.name); }
        }
      });
      this.flip(0);
      this.players.forEach((p, i) => {
        while (p.dogs.length < (opts.startDogs || 3)) p.dogs.push(this.dogDeck.pop());
        const base = p.gear.length ? 0 : 1;
        for (let j = 0; j < base + (opts.seatGear ? (opts.seatGear[i] || 0) : i); j++) if (this.gearDeck.length) p.gear.push(this.gearDeck.pop());
      });
      this.players.forEach(p => { if (p.keptStart.length) this.log(`${p.name} starts with kept cards: ${p.keptStart.join(", ")}.`, "good"); });
      // Gangline: every line starts empty; your starting dogs are in your hand.
    }

    shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {

    // ---------- helpers ----------

    // ---------- speed & cost ----------
    // line: [{dog, st}] in running order
    leadBonus(p, line, gearSel) {
      if (!line.length) return 0;

      if (f.dog.role !== "Lead" || f.st === "exh") return 0; // roles count rested or tired (never exhausted); abilities only when rested

        const d = x.dog;

        if (i === 1 && line[0].st === "rested" && line[0].dog.ab === "birch") v += 2;
        if (d.ab === "aurora" && p.pos >= 0 && this.finalLeg(p.pos)) v += 2;
        add(v, d.name);
      });

      const w = line[line.length - 1];
      if (w && w.st !== "exh" && w.dog.role === "Wheel" && runN >= 2) add(w.dog.ab === "yukon" ? 2 : 1, "Wheel bonus"); // a Wheel needs at least one dog ahead of it; Yukon's +2 is printed on both halves
      const m = p.musher, af = p.after;

      if (m === "Rookie" && af) add(1, "Rookie");
      if (m === "Night Runner" && p.campedLast) add(af ? 3 : 4, "Night Runner");

      add(p.runBonus, "Kept Events");

    trailCost(p, i, line, gearSel = [], known = true) {

      if (c.type === "F") return FINISH_COST;
      if (c.type === "CP") return this.cpCost();
      if (!c.up && !known) return null;
      let cost = c.cost;
      const reached = this.players.some(q => q !== p && !q.scratched && q.pos >= i);
      if (reached) cost -= c.name === "Deep Powder" ? 3 : 1;

      const rl = line.filter(x => x.st === "rested").map(x => x.dog);
      if (c.name === "Mountain Pass") cost -= rl.filter(d => d.role === "Wheel").reduce((s, d) => s + d.rs, 0);
      if (rl.some(d => d.ab === "nanook") && (c.name === "Spruce Forest" || c.name === "Exposed Ridge")) cost -= 1;
      if (rl.some(d => d.ab === "snowfield") && c.name === "Snowfield") cost -= 1;

    preview(p, line, gearSel = [], opts = {}) {

    }

    // ---------- events ----------
    drawEvent() {
      if (!this.eventDeck.length) {
        this.eventDeck = this.shuffle(this.eventDiscard);
        this.eventDiscard = [];
        this.log("The Event deck is reshuffled.", "sys");
      }
      const e = this.eventDeck.pop();
      this.eventDiscard.push(e);
      this.stats.events++;
      return e;
    }
    async event(p, source, opts = {}) {
      if (p.scratched || this.over) return;
      let choose2 = !!opts.choose2;
      if (p.musher === "Gambler" && !p.after) choose2 = true;
      let e;
      if (choose2) {
        const a = this.drawEvent(), b = this.drawEvent();
        const pick = await this.ask(p, { type: "pickEvent", options: [a, b], source });

      } else {
        e = this.drawEvent();
        this.log(`${p.name} draws an Event (${source}): ${e}.`, "ev");
      }

        if (!p.rookieLegs.has(leg) && HARSH[e] >= 3) {
          const use = await this.ask(p, { type: "rookieIgnore", card: e, source });
          if (use) {
            p.rookieLegs.add(leg);
            this.log(`${p.name} (Rookie) ignores ${e}.`, "good");
            return;
          }
        }
      }
      await this.tell(p, { type: "event", card: e, source });

      else await this.applyEvent(p, e);
      this.upd();
    }
    async applyEvent(p, e) {
      const harsh = this.finalLeg(p.pos) && !this.rules.noHarsh;
      const n = harsh ? 2 : 1;
      const huckle = false; // (no dog stops Squirrel! or the moose any more)
      switch (e) {
        case "Northern Lights": p.runBonus += 2; p.keptEvents.push(e); break;
        case "Tailwind": p.runBonus += 1; p.keptEvents.push(e); break;
        case "Fresh Snow": p.costMod += 1; p.keptEvents.push(e); break;
        case "Bitter Cold": for (let i = 0; i < (this.rules.harshCold && this.finalLeg(p.pos) ? 2 : n); i++) await this.removeDog(p, true, e, i + 1, n); break;
        case "Blizzard":

          break;

          break;
        }
        case "Squirrel!":
          if (huckle || p.dogs.some(d => d.role === "Wheel" && d.state === "rested")) { this.log(`A rested Wheel dog keeps the team in line. No effect.`, "good"); break; }

          break;
        case "Whiteout":
          for (let i = 0; i < n; i++) await this.removeDog(p, false, e, i + 1, n);

          break;

        case "Steep Climb": this.tired(p).forEach(d => d.state = "exh"); break;
        case "Lost Bootie":
          if (p.gear.length) {
            const id = await this.ask(p, { type: "lostBootie", options: p.gear.map(g => g.id) });
            const g = p.gear.find(x => x.id === id) || p.gear[0];
            p.gear.splice(p.gear.indexOf(g), 1);
            this.gearDeck.unshift(g);

    }
    async exhaustOne(p, cause) {

    }
    moveBack(p) {
      if (p.pos < 0) return;

    async removeDog(p, restedOk, cause, k = 1, n = 1) {

      let reason = "You must choose a tired or exhausted dog.";
      const flash = pool.filter(d => d.ab === "fragile");
      if (flash.length) { pool = flash; reason = "Flash is tired or exhausted, so Flash must go."; }
      if (!pool.length && restedOk) { pool = this.rested(p); reason = "You have no tired or exhausted dogs, so choose a rested one."; }
      if (!pool.length) return;
      const id = pool.length === 1 && p.bot ? pool[0].id : await this.ask(p, { type: "removeDog", options: pool.map(d => d.id), all: p.dogs.map(d => d.id), cause, reason, k, n });

      await this.dropDog(p, v, cause);
    }
    // Drop one particular dog (Huckle and the Sled Basket can still save it)
    async dropDog(p, v, cause) {
      if (p.scratched || !p.dogs.includes(v)) return;

        v.hardyUsed = true; v.state = "exh";
        this.log(`${v.name} toughs it out and is only exhausted (${cause}).`, "good");
        return;
      }
      const basket = p.gear.find(g => g.name === "Sled Basket");
      if (basket) {
        const use = await this.ask(p, { type: "sledBasket", dog: v.id, cause });
        if (use) {
          p.gear.splice(p.gear.indexOf(basket), 1); p.used.push(basket);
          v.state = "exh";
          this.log(`${p.name} loads ${v.name} into the Sled Basket. It's exhausted instead of dropped.`, "good");
          return;
        }
      }
      p.dogs.splice(p.dogs.indexOf(v), 1);
      if (p.line.includes(v)) p.line.splice(p.line.indexOf(v), 1);
      v.state = "removed";
      p.lost.push(v);

    }

    // ---------- gains ----------
    async drawDogs(p, draw, keep, source) {
      const drawn = [];
      for (let i = 0; i < draw && this.dogDeck.length; i++) drawn.push(this.dogDeck.pop());
      if (!drawn.length) return;
      let kept = drawn;
      if (drawn.length > keep) {
        const ids = await this.ask(p, { type: "keepDogs", options: drawn.map(d => d.id), cards: drawn, keep, source });
        kept = drawn.filter(d => ids.includes(d.id)).slice(0, keep);
        if (kept.length < keep) kept = kept.concat(drawn.filter(d => !kept.includes(d)).slice(0, keep - kept.length));
      }
      for (const d of kept) { d.state = "rested"; p.dogs.push(d); }
      for (const d of drawn) if (!kept.includes(d)) this.dogDeck.splice(Math.floor(this.r() * (this.dogDeck.length + 1)), 0, d);
      this.log(`${p.name} gains ${kept.map(d => d.name).join(" and ")} (${source}).`, "good");
    }
    takeGear(p, source) {
      if (!this.gearDeck.length) return;
      const g = this.gearDeck.pop();
      p.gear.push(g);
      this.log(`${p.name} takes ${p.bot ? "a gear" : g.name} (${source}).`, "good");
    }
    async claim(p, line, at = p.pos) {
      const c = this.path[at];
      if (!c || c.type !== "T" || !c.reward) return;
      if (line.some(x => x.st === "tired" && x.dog.ab === "scavenger")) { this.log(`Tired Ranger wanders off. ${p.name} can't take the trail reward.`, "bad"); return; }
      const { kind, card } = c.reward;
      c.reward = null;
      if (kind === "dog") { card.state = "rested"; p.dogs.push(card); }
      else p.gear.push(card);
      this.log(`${p.name} takes the trail reward: ${card.name}.`, "good");
      if (p.musher === "Trapper") await this.drawDogs(p, 1, 1, "Trapper");
      if (line.some(x => x.st === "rested" && x.dog.ab === "scavenger")) this.takeGear(p, "Ranger");

    }

    // ---------- actions ----------
    legal(p) {
      const here = p.pos >= 0 ? this.path[p.pos] : null;
      const atOpenCP = here && here.type === "CP" && !p.camped.has(here.cp);
      const nxt = p.pos + 1;
      const slogDest = nxt < this.path.length && this.path[nxt].type !== "F" && !(here && here.type === "CP" && !this.canPassCP(p, p.pos)) ? nxt : null;
      const slogLeg = slogDest != null ? this.legOf(slogDest) : null;

      const stuck = !this.canRunNext(p);

    }
    canRunNext(p) {
      const sp = d => d.state === "rested" ? d.rs : d.ts;
      let pool = p.dogs.filter(d => d.state !== "exh").sort((a, b) => sp(b) - sp(a)).map(d => ({ dog: d, st: d.state }));
      if (!pool.length) return false;
      if (this.rules.lineMax) pool = pool.slice(0, this.rules.lineMax);
      return this.preview(p, Bot.arrange(pool), [], { known: true }).crossed >= 1;
    }

    async useFreeGear(p, gid, target) {
      const g = p.gear.find(x => x.id === gid);
      if (!g) return;
      if (g.name === "Dog Food") {
        const d = p.dogs.find(x => x.id === target && x.state === "exh") || this.exh(p)[0];
        if (!d) return;

        d.state = "rested";
        this.log(`${p.name} uses a Whistle: ${d.name} is back in hand.`, "good");

        if (!this.tired(p).length) return;

      p.used.push(g);
      this.upd();
    }

    async doRun(p, action) {
      let line = action.line.map(x => ({ dog: p.dogs.find(d => d.id === x.id), st: null })).filter(x => x.dog);
      if (this.rules.lineMax) line = line.slice(0, this.rules.lineMax);
      line.forEach(x => x.st = x.dog.state);
      let bigLineHit = false;
      const runEvents = []; // trail Events from this Run resolve after the dogs are tired, like push Events
      const gearSel = (action.gear || []).map(id => p.gear.find(g => g.id === id)).filter(Boolean);
      const sp = this.speedOf(p, line, gearSel);
      const pushed = line.filter(x => x.st === "tired");
      if (line.some(x => x.dog.ab === "ignore1" && (x.st === "rested" || x.dog.tt))) p.ignoreLeft = 1;
      p.shadowTurn = line.some(x => x.st === "rested" && x.dog.ab === "shadow");
      const heavy = line.some(x => x.dog.ab === "heavy");
      // spend gear
      for (const g of gearSel) { p.gear.splice(p.gear.indexOf(g), 1); p.used.push(g); }
      this.log(`${p.name} runs ${line.map(x => x.dog.name + (x.st === "tired" ? " (tired)" : "")).join(", ")}${gearSel.length ? " with " + gearSel.map(g => g.name).join(", ") : ""}: Speed ${sp.total}.`, "act");
      let pool = sp.total, crossed = 0, finalCount = 0;
      const start = p.pos;
      while (!this.over && !p.scratched) {
        const pos = p.pos, nxt = pos + 1;
        if (nxt >= this.path.length) break;
        if (pos >= 0 && this.path[pos].type === "CP" && !this.canPassCP(p, pos)) break;
        const c = this.path[nxt];
        if (this.rules.finalRunMax && this.finalLeg(nxt) && finalCount >= this.rules.finalRunMax) { this.log(`The storm limits ${p.name} to ${this.rules.finalRunMax} final-leg trail${this.rules.finalRunMax > 1 ? "s" : ""} this Run.`, ""); break; }
        if (c.type === "T" && !c.up) this.flip(nxt);
        if (c.type === "T" && c.name === "River Ice" && heavy) { this.log(`Tank refuses to step onto River Ice.`, ""); break; }
        const cost = this.trailCost(p, nxt, line, gearSel);
        if (cost > pool) break;
        // at a checkpoint we entered this run: may stop
        if (pos >= 0 && this.path[pos].type === "CP" && crossed > 0) {
          const go = await this.ask(p, { type: "stopAtCP", cp: this.path[pos].cp, left: pool, nextCost: cost });
          if (!go) { this.log(`${p.name} stops at Checkpoint ${this.path[pos].cp}.`, "act"); break; }
        }
        pool -= cost; p.pos = nxt; crossed++;
        if (this.finalLeg(nxt)) finalCount++;
        this.onMoveOnto(nxt);
        this.upd();
        if (c.type === "F") {
          this.winner = p; this.over = true;
          this.log(`${p.name} crosses the Finish and wins the Long Trail!`, "win");
          this.upd();
          return;
        }
        if (this.rules.bigLine && !bigLineHit && c.type === "T" && this.finalLeg(nxt) && line.length >= this.rules.bigLine) {
          bigLineHit = true;
          runEvents.push("a big team on the final leg");
        }
        if (c.type === "T" && c.name === "River Ice" && line.length >= 3 && !this.shadowSafe(p)) runEvents.push("River Ice");
        if (c.type === "CP") {
          this.log(`${p.name} reaches Checkpoint ${c.cp}.`, "act");
          await this.vetCheck(p, nxt);
          this.upd();
        }
        if (!this.cpCost() && nxt + 1 < this.path.length && this.path[nxt + 1].type === "CP") {
          p.pos = nxt + 1;
          this.onMoveOnto(nxt + 1);
          this.log(`${p.name} reaches Checkpoint ${this.path[nxt + 1].cp}.`, "act");
          await this.vetCheck(p, nxt + 1, line);
          this.upd();
        }
      }
      if (crossed === 0) this.log(`${p.name} can't make any progress.`, "");
      else if (p.pos !== start) this.log(`${p.name} moves from ${this.label(start)} to ${this.label(p.pos)}.`, "act");
      else this.log(`${p.name} ends the Run back at ${this.label(p.pos)}.`, "act");
      if (!p.scratched && crossed > 0) {
        // A Run that stops at a checkpoint ended on that leg's last trail, so its reward can be taken.
        let at = p.pos;
        if (!this.rules.noCpReward && this.path[at] && this.path[at].type === "CP" && at - 1 > start && this.path[at - 1].type === "T") at = at - 1;
        await this.claim(p, line, at);
      }
      p.runBonus = 0; p.costMod = 0; p.keptEvents = []; p.campedLast = false;
      for (const x of line) {
        if (!p.dogs.includes(x.dog)) continue;
        if (x.st === "rested") x.dog.state = "tired";
        else if (x.st === "tired") {
          if (x.dog.ab === "northstar") { x.dog.state = "rested"; this.log(`${x.dog.name} trots back to ${p.name}'s hand.`, "good"); }
          else x.dog.state = "exh";
        }
      }
      for (const x of line) if (x.st === "tired" && x.dog.ab === "bramble" && p.dogs.includes(x.dog)) await this.dropDog(p, x.dog, "Bramble ran tired");
      if (line.some(x => x.st === "rested" && x.dog.ab === "tinker") && p.used.length) {
        const opts = p.used.map(g => g.id);
        if (opts.length) {
          const id = await this.ask(p, { type: "tinker", options: opts });
          const g = p.used.find(x => x.id === id) || p.used.find(x => opts.includes(x.id));
          p.used.splice(p.used.indexOf(g), 1); p.gear.push(g);
          this.log(`Tinker fixes up ${g.name}: back in hand.`, "good");
        }
      }
      this.upd();
      // Scout looks ahead once the Run has flipped what it flips, so the peek is a trail still face down
      if (!p.scratched && line[0] && line[0].st === "rested" && line[0].dog.ab === "scout") {
        const ids = this.nextFaceDown(p, 1);
        if (ids.length) { this.log(`${p.name}'s Scout looks at the trail ahead.`, ""); await this.tell(p, { type: "peek", trails: ids, source: "Scout" }); }
      }
      for (const src of runEvents) { if (p.scratched) break; await this.event(p, src); }
      if (pushed.length && !p.scratched) {
        if (gearSel.some(g => g.name === "Booties")) {
          this.log(`Booties protect the pushed dogs. No Event.`, "good");
        } else {
          const k = this.rules.legacyPush ? (this.finalLeg(p.pos) && !this.rules.noPushPerDog ? pushed.length : 1) : pushed.length;
          for (let i = 0; i < k && !p.scratched; i++) await this.event(p, "pushing tired dogs");
        }
      }
    }

    async vetCheck(p, pos, line = []) {
      if (!this.rules.vetCheck || this.path[pos].type !== "CP" || this.path[pos].cp !== 2) return;
      // dogs that ran tired this turn are already exhausted after the run, so check exhausted + pushed dogs
      const out = p.dogs.filter(d => d.state === "exh" || line.some(x => x.dog === d && x.st === "tired"));
      for (const d of out) { p.dogs.splice(p.dogs.indexOf(d), 1); d.state = "removed"; p.lost.push(d); this.stats.removed++; }
      if (out.length) this.log(`Vet check at Checkpoint 2: ${out.map(d => d.name).join(", ")} ${out.length > 1 ? "are" : "is"} too worn out and head${out.length > 1 ? "" : "s"} home.`, "bad");
      else this.log(`Vet check at Checkpoint 2: ${p.name}'s team passes.`, "good");
      if (!p.dogs.length) { p.scratched = true; p.scratchPos = p.pos; p.scratchRound = this.round; this.log(`${p.name} has no dogs left and is scratched.`, "bad"); }
      this.upd();
      await this.tell(p, { type: "vetCheck", cards: out, scratched: p.scratched });
    }
    async doSlog(p, action) {
      const nxt = p.pos + 1;
      const leg = this.legOf(nxt);
      p.slogLegs.add(leg);
      p.pos = nxt;
      this.onMoveOnto(nxt);
      if (this.path[nxt].type === "CP") await this.vetCheck(p, nxt);
      if (p.scratched) return;
      if (!this.cpCost() && this.path[nxt].type === "T" && nxt + 1 < this.path.length && this.path[nxt + 1].type === "CP") {
        p.pos = nxt + 1;
        this.onMoveOnto(nxt + 1);
        await this.vetCheck(p, nxt + 1);
        if (p.scratched) return;
      }
      this.log(`${p.name} slogs to ${this.label(p.pos)}.`, "act");
      this.upd();
      if (p.musher === "Veteran" && !p.after) { this.log(`The Veteran knows the trail. No Event.`, "good"); return; }
      const lantern = action.lantern && p.gear.find(g => g.name === "Red Lantern");
      if (lantern) {
        p.gear.splice(p.gear.indexOf(lantern), 1); p.used.push(lantern);
        this.log(`The Red Lantern lights the way. No Event.`, "good");
        return;
      }
      await this.event(p, "slogging");
    }

    shadowSafe(p) { return p.shadowTurn || p.dogs.some(d => d.ab === "shadow" && d.state === "rested"); }
    refreshDogs(p) { p.dogs.forEach(d => { if (d.state !== "rested") d.state = "rested"; }); }

    async doCampOpen(p, action) {
      p.campedLast = true;
      const here = p.pos >= 0 ? this.path[p.pos] : null;
      this.log(`${p.name} camps in the open at ${this.label(p.pos)}.`, "act");
      if (p.musher === "Trapper" && p.after) await this.drawDogs(p, 1, 1, "Trapper");
      let safe = null;
      if (here && here.type === "T" && here.name === "Spruce Forest") safe = "The Spruce Forest shelters the team.";
      else if (p.musher === "Night Runner" && p.after) safe = "The Night Runner camps safely.";
      else if (action.bivy) {
        const b = p.gear.find(g => g.name === "Bivy Sack");
        if (b) { p.gear.splice(p.gear.indexOf(b), 1); p.used.push(b); safe = "The Bivy Sack keeps everyone warm."; }
      }
      const cocoa = p.dogs.some(d => d.ab === "cocoa" && d.state === "rested");
      if (safe) this.log(`${safe} No Event.`, "good");
      else await this.event(p, "camping in the open");
      if (!p.scratched) this.refreshDogs(p);
      if (!p.scratched && cocoa && p.dogs.some(d => d.ab === "cocoa") && p.used.length) {
        const opts = p.used.map(g => g.id);
        const id = await this.ask(p, { type: "tinker", options: opts, source: "Cocoa" });
        const g = p.used.find(x => x.id === id) || p.used[0];
        p.used.splice(p.used.indexOf(g), 1); p.gear.push(g);
        this.log(`Cocoa curls up by the fire. ${g.name} is back in hand.`, "good");
      }
      this.upd();
    }

    async drawGearKeep(p, draw, source) {
      const drawn = [];
      for (let i = 0; i < draw && this.gearDeck.length; i++) drawn.push(this.gearDeck.pop());
      if (!drawn.length) return;
      let keep = drawn[0];
      if (drawn.length > 1) {
        const id = await this.ask(p, { type: "keepGear", options: drawn.map(g => g.id), cards: drawn, source });
        keep = drawn.find(g => g.id === id) || drawn[0];
      }
      p.gear.push(keep);
      for (const g of drawn) if (g !== keep) this.gearDeck.splice(Math.floor(this.r() * (this.gearDeck.length + 1)), 0, g);
      this.log(`${p.name} keeps ${p.bot ? "a gear" : keep.name} (${source}).`, "good");
    }
    // What a checkpoint camp gives: [dogs drawn, dogs kept, gear drawn (keep 1)]
    cpGains(cp, long) {
      // "standard" (formerly "lean"): camp = 1 dog + top gear; Long Rest = draw 2 dogs keep 1, draw 2 gear keep 1.
      // "generous" (the old standard): camp = draw 2 dogs + top gear; Long Rest = draw 3 keep 2, draw 2 gear keep 1.
      if (this.format === "gangline") return [1, 1, 1]; // Gangline: camp or Long Rest = 1 dog and 1 gear
      if (this.mode === "generous") return long ? [3, 2, 2] : [2, 2, 1];
      return long ? [2, 1, 2] : [1, 1, 1];
    }
    async doCampCP(p, long) {
      const cp = this.path[p.pos].cp;
      p.camped.add(cp);
      p.campedLast = true;
      this.refreshDogs(p);
      const trapExtra = p.musher === "Trapper" && !p.after ? 3 : 0;
      const [dd, dk, gd] = this.cpGains(cp, long);
      const src = long ? "Long Rest" : "Checkpoint camp";
      if (long) {
        p.gear.push(...p.used); p.used = [];
        this.log(`${p.name} takes the Long Rest at Checkpoint ${cp}.`, "act");
      } else this.log(`${p.name} camps at Checkpoint ${cp}.`, "act");
      await this.drawDogs(p, dd + trapExtra, dk, src);
      if (gd > 1) await this.drawGearKeep(p, gd, src);
      else this.takeGear(p, src);
      if (long) {
        p.longRested = true;
        p.skip += 1;
        p.flipAfterSkip = true;
      }
      this.upd();
    }

    // =================== Gangline mode (prototype) ===================
    gLine(p) { return p.line.map(d => ({ dog: d, st: d.state })); }
    gHand(p) { return p.dogs.filter(d => !p.line.includes(d)); }
    gSpeed(p, gearSel = []) { return this.speedOf(p, this.gLine(p), gearSel); }
    // Can the team step onto the next trail right now?
    gNext(p, gearSel = []) {
      const nxt = p.pos + 1;
      if (nxt >= this.path.length) return null;
      if (p.pos >= 0 && this.path[p.pos].type === "CP" && !this.canPassCP(p, p.pos)) return null;
      const c = this.path[nxt];
      const line = this.gLine(p);
      const tank = line.some(x => x.dog.ab === "heavy" && x.st !== "exh");
      const sp = this.speedOf(p, line, gearSel).total;
      if (c.type === "T" && !c.up) return { nxt, c, speed: sp, cost: null, ok: false, hidden: true };
      const cost = this.trailCost(p, nxt, line, gearSel);
      const blocked = c.type === "T" && c.name === "River Ice" && tank;
      return { nxt, c, speed: sp, cost, ok: !blocked && sp >= cost, blocked };
    }
    gTire(d) {
      if (d.state === "rested") d.state = "tired";
      else if (d.state === "tired") d.state = "exh";
    }
    async gTireLead(p, why) {
      const f = p.line[0];
      if (!f) return;
      if (f.state === "tired" && f.ab === "northstar") { // Chappell: returns to your hand instead of becoming exhausted
        p.line.shift(); f.state = "rested";
        this.log(`${f.name} trots back to ${p.name}'s hand.`, "good");
        return;
      }
      const was = f.state;
      this.gTire(f);
      if (f.state !== was) this.log(`${f.name} ${f.state === "tired" ? "tires" : "is exhausted"} (${why}).`, f.state === "exh" ? "bad" : "");
    }
    gHitch(p, id, end) {
      if (p.hitched) return;
      const d = this.gHand(p).find(x => x.id === id);
      if (!d) return;
      if (this.rules.lineMax && p.line.length >= this.rules.lineMax) return;
      d.state = "rested";
      if (end === "front") p.line.unshift(d); else p.line.push(d);
      p.hitched = true;
      this.log(`${p.name} hitches ${d.name} at the ${end === "front" ? "front" : "back"}.`, "act");
      this.upd();
    }
    async gGo(p, action) {
      const gearSel = (action.gear || []).map(id => p.gear.find(g => g.id === id)).filter(Boolean);
      for (const g of gearSel) { p.gear.splice(p.gear.indexOf(g), 1); p.used.push(g); }
      const booties = gearSel.some(g => g.name === "Booties");
      const line0 = this.gLine(p);
      if (line0.some(x => x.dog.ab === "ignore1" && (x.st === "rested" || (x.st !== "exh" && x.dog.tt)))) p.ignoreLeft = 1;
      p.shadowTurn = line0.some(x => x.st === "rested" && x.dog.ab === "shadow");
      const start = p.pos;
      let moved = 0;
      const runEvents = [];
      this.log(`${p.name} sets off: Speed ${this.gSpeed(p, gearSel).total}${gearSel.length ? " with " + gearSel.map(g => g.name).join(", ") : ""}.`, "act");
      while (!this.over && !p.scratched) {
        const n = this.gNext(p, gearSel);
        if (!n || !n.ok) break;
        if (moved > 0) {
          const go = await this.ask(p, { type: "gContinue", speed: n.speed, cost: n.cost, next: n.nxt, label: this.label(n.nxt) });
          if (!go) break;
        }
        p.pos = n.nxt; moved++;
        this.onMoveOnto(n.nxt);
        if (n.c.type === "F") {
          this.winner = p; this.over = true;
          this.log(`${p.name} crosses the Finish and wins the Long Trail!`, "win");
          this.upd();
          return;
        }
        if (n.c.type === "CP") { this.log(`${p.name} reaches Checkpoint ${n.c.cp}.`, "act"); await this.vetCheck(p, n.nxt); }
        if (n.c.type === "T" && n.c.name === "River Ice" && p.line.filter(d => d.state !== "exh").length >= 3 && !this.shadowSafe(p)) runEvents.push("River Ice");
        if (!booties) await this.gTireLead(p, "breaking trail");
        this.upd();
      }
      if (moved) this.log(`${p.name} moves from ${this.label(start)} to ${this.label(p.pos)}.`, "act");
      if (!p.scratched && moved) {
        let at = p.pos;
        if (this.path[at] && this.path[at].type === "CP" && at - 1 > start && this.path[at - 1].type === "T") at = at - 1;
        await this.claim(p, line0, at);
      }
      p.runBonus = 0; p.costMod = 0; p.keptEvents = []; p.campedLast = false;
      for (const x of line0) if (x.st === "tired" && x.dog.ab === "bramble" && p.dogs.includes(x.dog)) await this.dropDog(p, x.dog, "Bramble ran tired");
      if (line0.some(x => x.st === "rested" && x.dog.ab === "tinker") && p.used.length) {
        const opts = p.used.map(g => g.id);
        const id = await this.ask(p, { type: "tinker", options: opts });
        const g = p.used.find(x => x.id === id) || p.used[0];
        p.used.splice(p.used.indexOf(g), 1); p.gear.push(g);
        this.log(`Tinker fixes up ${g.name}: back in hand.`, "good");
      }
      if (!p.scratched && line0[0] && line0[0].st === "rested" && line0[0].dog.ab === "scout") {
        const ids = this.nextFaceDown(p, 1);
        if (ids.length) { this.log(`${p.name}'s Scout looks at the trail ahead.`, ""); await this.tell(p, { type: "peek", trails: ids, source: "Scout" }); }
      }
      for (const src of runEvents) { if (p.scratched) break; await this.event(p, src); }
    }
    // Camp in the open: every dog in the line recovers one step; you may send dogs back to your hand.
    async gCamp(p, action) {
      p.campedLast = true;
      const here = p.pos >= 0 ? this.path[p.pos] : null;
      this.log(`${p.name} camps in the open at ${this.label(p.pos)}.`, "act");
      if (p.musher === "Trapper" && p.after) await this.drawDogs(p, 1, 1, "Trapper");
      for (const d of p.line) { if (d.state === "exh") d.state = "tired"; else if (d.state === "tired") d.state = "rested"; }
      const back = (action.ret || []).map(id => p.line.find(d => d.id === id)).filter(Boolean);
      for (const d of back) { p.line.splice(p.line.indexOf(d), 1); d.state = "rested"; }
      if (back.length) this.log(`${p.name} brings ${back.map(d => d.name).join(", ")} back to hand.`, "");
      const cocoa = this.gHand(p).some(d => d.ab === "cocoa");
      if (cocoa && p.used.length) {
        const id = await this.ask(p, { type: "tinker", options: p.used.map(g => g.id), source: "Cocoa" });
        const g = p.used.find(x => x.id === id) || p.used[0];
        p.used.splice(p.used.indexOf(g), 1); p.gear.push(g);
        this.log(`Cocoa curls up by the fire. ${g.name} is back in hand.`, "good");
      }
      let safe = null;
      if (here && here.type === "T" && here.name === "Spruce Forest") safe = "The Spruce Forest shelters the team.";
      else if (p.musher === "Night Runner" && p.after) safe = "The Night Runner camps safely.";
      else if (action.bivy) {
        const b = p.gear.find(g => g.name === "Bivy Sack");
        if (b) { p.gear.splice(p.gear.indexOf(b), 1); p.used.push(b); safe = "The Bivy Sack keeps everyone warm."; }
      }
      return safe;
    }
    async applyGEvent(p, e) {
      const line = p.line;
      const pickLine = async (pred, why) => {
        const pool = line.filter(pred);
        if (!pool.length) return null;
        const id = pool.length === 1 && p.bot ? pool[0].id : await this.ask(p, { type: "exhaustDog", options: pool.map(d => d.id), all: line.map(d => d.id), cause: e, reason: why });
        return pool.find(d => d.id === id) || pool[0];
      };
      const dropExh = async () => {
        let pool = line.filter(d => d.state === "exh");
        const flash = line.filter(d => d.ab === "fragile" && d.state !== "rested");
        if (flash.length) pool = flash;
        if (!pool.length) return false;
        const id = pool.length === 1 && p.bot ? pool[0].id : await this.ask(p, { type: "removeDog", options: pool.map(d => d.id), all: line.map(d => d.id), cause: e, reason: flash.length ? "Flash is tired or exhausted, so Flash must go." : "Choose an exhausted dog." });
        await this.dropDog(p, pool.find(d => d.id === id) || pool[0], e);
        return true;
      };
      switch (e) {
        case "Deep Snow": { const f = line[0]; if (f && f.state === "rested") { f.state = "tired"; this.log(`${f.name} tires in the deep snow.`, "bad"); } break; }
        case "Long Climb": { const t = line.filter(d => d.role === "Team" && d.state === "rested"); t.forEach(d => d.state = "tired"); if (t.length) this.log(`${t.map(d => d.name).join(", ")} tire${t.length === 1 ? "s" : ""} on the climb.`, "bad"); break; }
        case "Cold Snap": { const d = await pickLine(d => d.state === "tired", "Choose a tired dog to exhaust."); if (d) { d.state = "exh"; this.log(`${d.name} is exhausted (${e}).`, "bad"); } break; }
        case "Steep Climb": line.filter(d => d.state === "tired").forEach(d => d.state = "exh"); break;
        case "Tangled Lines": if (line.length > 1) { const f = line.shift(); line.push(f); this.log(`${f.name} ends up at the back of the line.`, "bad"); } break;
        case "Bitter Cold": if (!(await dropExh())) { const d = await pickLine(d => d.state === "tired", "No exhausted dogs: choose a tired dog to exhaust."); if (d) { d.state = "exh"; this.log(`${d.name} is exhausted (${e}).`, "bad"); } } break;
        case "Blizzard": await dropExh(); if (!p.scratched) this.moveBack(p); break;
        case "Whiteout": p.noGo = true; this.log(`${p.name} can't Go next turn.`, "bad"); break;
        case "Second Wind": { const d = await pickLine(d => d.state === "tired", "Choose a tired dog to rest."); if (d) { d.state = "rested"; this.log(`${d.name} gets a second wind.`, "good"); } break; }
        case "Tailwind": p.runBonus += 2; p.keptEvents.push(e); break;
        default: break;
      }
      this.upd();
    }
    async gTurn(p) {
      if (this.io.turnStart) await this.io.turnStart(p);
      p.hitched = false;
      const noGo = p.noGo; p.noGo = false;
      let action;
      for (let guard = 0; guard < 30; guard++) {
        action = p.bot ? Bot.gAction(this, p, noGo) : await this.io.ask(p, { type: "action", noGo });
        if (action.type === "hitch") { this.gHitch(p, action.id, action.end); continue; }
        if (action.type === "gear") { await this.useFreeGear(p, action.gear, action.target); continue; }
        break;
      }
      const here = p.pos >= 0 ? this.path[p.pos] : null;
      const atOpenCP = here && here.type === "CP" && !p.camped.has(here.cp);
      const mustLong = atOpenCP && here.cp === 2 && !p.longRested;
      if (action.type === "go" && (noGo || !(this.gNext(p, (action.gear || []).map(id => p.gear.find(g => g.id === id)).filter(Boolean)) || {}).ok)) action = { type: "camp" };
      if (action.type === "cp" && !atOpenCP) action = { type: "camp" };
      if (mustLong && action.type !== "cp") action = { type: "cp", long: true };

  open() { return new Promise((res, rej) => { try { const r = indexedDB.open("longtrail-art", 1); r.onupgradeneeded = () => r.result.createObjectStore("files"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async save(files) { try { const db = await this.open(); const tx = db.transaction("files", "readwrite"); const st = tx.objectStore("files"); st.clear(); for (const [name, blob] of files) st.put(blob, name); await new Promise(r => { tx.oncomplete = r; tx.onerror = r; }); } catch {} },
  async load() { try { const db = await this.open(); const tx = db.transaction("files", "readonly"); const st = tx.objectStore("files"); const keys = await new Promise(r => { const q = st.getAllKeys(); q.onsuccess = () => r(q.result); q.onerror = () => r([]); }); const vals = await new Promise(r => { const q = st.getAll(); q.onsuccess = () => r(q.result); q.onerror = () => r([]); }); return keys.map((k, i) => [k, vals[i]]); } catch { return []; } },
  async clear() { try { const db = await this.open(); const tx = db.transaction("files", "readwrite"); tx.objectStore("files").clear(); } catch {} },
};
function useFiles(fileList, remember) {
  const imgs = [...fileList].filter(f => /\.(png|jpe?g|webp|gif|svg)$/i.test(f.name));
  if (!imgs.length) return 0;
  imgs.sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name));
  setArt(imgs.map(f => [f.webkitRelativePath || f.name, URL.createObjectURL(f)]), "your folder");
  if (remember) IDB.save(imgs.map(f => [f.webkitRelativePath || f.name, new Blob([f], { type: f.type })]));
  return imgs.length;
}
async function restoreFiles() {
  const rows = await IDB.load();
  if (!rows.length) return false;
  setArt(rows.map(([n, b]) => [n, URL.createObjectURL(b)]), "your folder (saved in this browser)");
  return true;
}

  legs: store.get("legs", [1, 2, 4]),
  game: null,
  pending: null,      // {p, req, resolve}
  run: null,          // run builder {line:[ids], gear:Set}
  viewer: null,       // human whose hand is shown
  lastPassed: null,
  freshFrom: 0,
  lastAct: {},
  overlay: null,      // local modal (free gear target etc.)

// The standard game: 1-2-4 trails, standard (lean) checkpoints, no harsh weather, 6-dog gangline.
const STANDARD = { legs: [1, 2, 4], mode: "standard", rules: { lineMax: 6, noHarsh: true } };
function resetToStandard() {
  S.legs = STANDARD.legs.slice(); S.mode = STANDARD.mode; S.rules = { ...STANDARD.rules };
  store.set("legs", S.legs); store.set("mode", S.mode); store.set("rules", S.rules);
}
// Settings saved before the new standard used old names/defaults: move everyone onto the new standard once.
if (store.get("settingsVer", 1) < 2) { resetToStandard(); store.set("settingsVer", 2); }
// Pushing now draws an Event per tired dog all race, so the old "easy pushing" switch is gone.
if (S.rules && S.rules.noPushPerDog) { delete S.rules.noPushPerDog; store.set("rules", S.rules); }
if (S.mode === "lean") { S.mode = "standard"; store.set("mode", S.mode); }
if (S.rules.finalRunMax) { delete S.rules.finalRunMax; store.set("rules", S.rules); }
const humans = () => S.game ? S.game.players.filter(p => !p.bot) : [];

// ---------------- Game IO ----------------
function makeIO() {
  const io = {
    G: null,
    rec: [],      // every answer a human gave, in order: replaying them rebuilds the race
    replay: null, // answers still to feed back while resuming a saved race
    live() { return S.game && S.game === io.G; },
    log(line) {
      if (!io.live()) return;
      const g = S.game;
      if (g.current && line.cls !== "round") S.lastAct[g.current.idx] = line.msg;
      if (!io.replay) renderLog();
    },
    update() { if (io.live() && !io.replay && S.screen === "game") renderGame(); },
    ask(p, req) {
      if (!io.live()) return new Promise(() => {});
      if (io.replay) {
        if (io.replay.length) return Promise.resolve(io.replay.shift().v);
        return io.goLive(p).then(() => io.ask(p, req));
      }
      return new Promise(resolve => {
        S.pending = { p, req, resolve: v => { io.rec.push(v === undefined ? {} : { v }); saveRace(); resolve(v); } };
        if (req.type === "action") {
          // after using gear mid-setup, come back to the same line
          if (S.keepRun) { const k = S.keepRun; S.keepRun = null;
            S.run = { line: k.line.filter(id => p.dogs.some(d => d.id === id && d.state !== "exh")), gear: new Set([...k.gear].filter(id => p.gear.some(x => x.id === id))) };
          } else S.run = null;
        }
        renderGame();
      });
    },
    // The saved answers have run out: the race is back where it was saved. Hand it to the right player.
    async goLive(p) {
      io.replay = null;
      renderGame(true);
      if (humans().length > 1) { S.viewer = null; await new Promise(res => { S.overlay = { type: "pass", p, res }; renderGame(); }); }
      S.viewer = p;
      T.turnBegin();
      renderGame(true);
    },
    async turnStart(p) {
      if (!io.live()) return new Promise(() => {});
      if (io.replay) return;
      await T.waitRunning();
      if (p.bot) {
        T.turnBegin();
        if (S.botSpeed > 0) { renderGame(); await sleep(S.botSpeed * 0.6); }
        return;
      }
      if (humans().length > 1 && S.viewer !== p) {
        S.viewer = null;
        await new Promise(res => { S.overlay = { type: "pass", p, res }; renderGame(); });
      }
      T.turnBegin();
      S.viewer = p;
      renderGame();
    },
    async afterTurn(p) {
      if (!io.live()) return new Promise(() => {});
      if (io.replay) return;
      if (p.bot && S.botSpeed > 0) await sleep(S.botSpeed);
      T.turnEnd(p);
      saveRace();
      await T.waitRunning();
    },
  };
  return io;
}
// ---------------- Save and resume ----------------
// A race is saved as its setup plus every answer the humans gave. Resuming builds the same race from the
// same seed and feeds those answers back instantly, so it lands exactly where it was left.
function saveRace() {
  const g = S.game, io = g && g.io;
  if (!g || g.over || !io || !io.opts || io.replay || !g.players.some(p => !p.bot)) return;
  store.set("save", { v: 1, build: LT_BUILD, opts: io.opts, rec: io.rec, timer: { elapsed: T.active(), per: T.per.slice(), turns: T.turns.slice() },
    round: g.round, names: g.players.map(p => p.name), at: Date.now() });
}
function savedRace() { const sv = store.get("save", null); return sv && sv.v === 1 && sv.opts ? sv : null; }
function clearSave() { store.set("save", null); }
// ---------------- Race timer ----------------
const T = {
  reset(n) { this.start = Date.now(); this.pausedTotal = 0; this.pausedAt = null; this.end = null; this.per = Array(n).fill(0); this.turns = Array(n).fill(0); this.ts = null; },
  active() { if (this.start == null) return 0; if (this.end != null) return this.end; return (this.pausedAt || Date.now()) - this.start - this.pausedTotal; },
  pause() { if (this.pausedAt == null && this.end == null) this.pausedAt = Date.now(); },
  resume() { if (this.pausedAt != null) { this.pausedTotal += Date.now() - this.pausedAt; this.pausedAt = null; (this.waiters || []).splice(0).forEach(f => f()); } },
  waitRunning() { return this.pausedAt == null ? Promise.resolve() : new Promise(r => (this.waiters = this.waiters || []).push(r)); },
  stop() { if (this.end == null) this.end = this.active(); },
  turnBegin() { this.ts = this.active(); },
  turnEnd(p) { if (this.ts == null) return; this.per[p.idx] += this.active() - this.ts; this.turns[p.idx]++; this.ts = null; },
};
const fmt = ms => { const s = Math.floor(ms / 1000); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0"); };
function tickClock() {
  const el = $("#clock"); if (!el) return;
  el.textContent = fmt(T.active());
  const b = $("#pausebtn"); if (b) b.textContent = T.pausedAt != null ? "Resume" : "Pause";
}
setInterval(tickClock, 500);

function resolvePending(v) {
  const pd = S.pending;
  if (!pd) return;
  S.pending = null;
  S.run = null;
  pd.resolve(v);
}

async function startGame(seed, resume) {
  let opts;
  if (resume) opts = resume.opts;
  else {
    const seats = S.seats.map((s, i) => ({ name: s.name.trim() || (s.bot ? `Bot ${i + 1}` : `Player ${i + 1}`), bot: s.bot, musher: s.musher, color: COLORS[i], kept: s.kept || null }));
    store.set("seats", S.seats);
    opts = { players: seats, seed, mode: S.mode, rules: { ...S.rules }, legs: S.legs.slice(), format: S.format };
  }
  const io = makeIO();
  S.game = new LT.Game({ ...opts, io });
  io.G = S.game;
  io.opts = { ...opts, seed: S.game.seed };
  S.screen = "game"; S.pending = null; S.run = null; S.overlay = null; S.lastAct = {}; S.carry = null;
  T.reset(opts.players.length);
  if (resume) {
    io.rec = resume.rec.slice(); io.replay = resume.rec.slice();
    T.start = Date.now() - (resume.timer.elapsed || 0); T.per = resume.timer.per.slice(); T.turns = resume.timer.turns.slice();
    S.viewer = null;
  } else {
    const hs = humans();
    S.viewer = hs.length === 1 ? hs[0] : null;
    saveRace();
  }
  render();
  const g = S.game;
  try { await g.play(); } catch (e) { console.error(e); g.log("Something went wrong: " + e.message, "sys"); }
  if (S.game === g) { io.replay = null; clearSave(); T.stop(); tickClock(); setupCarry(g); S.overlay = { type: "over" }; renderGame(true); }
}

// ---------------- Carry-over ----------------
// Winner keeps 1 card, every other musher who finished keeps 2, scratched mushers keep nothing. At most 1 gear.
const dogVal = d => d.rs + 0.5 * d.ts + (d.ab ? 0.5 : 0);
function setupCarry(g) {
  S.carry = g.players.map(p => {
    const allow = p.scratched ? 0 : g.winner === p ? 1 : 2;
    const seen = new Set();
    const opts = [...p.dogs.map(d => ({ k: "dog", name: d.name, card: d })),
      ...[...p.gear, ...p.used].filter(x => !seen.has(x.name) && seen.add(x.name)).map(x => ({ k: "gear", name: x.name, card: x }))];
    const pick = opts.map((o, j) => j).filter(j => opts[j].k === "dog").sort((a, b) => dogVal(opts[b].card) - dogVal(opts[a].card)).slice(0, allow);
    const g0 = opts.findIndex(o => o.k === "gear");
    if (pick.length < allow && g0 >= 0) pick.push(g0);
    return { allow, opts, pick, why: p.scratched ? "scratched" : g.winner === p ? "winner" : "finished" };
  });
  applyCarry();
}
function applyCarry() {
  (S.carry || []).forEach((c, i) => {
    if (!S.seats[i]) return;
    const pk = c.pick.map(j => c.opts[j]);
    S.seats[i].kept = { dogs: pk.filter(o => o.k === "dog").map(o => o.name), gear: pk.filter(o => o.k === "gear").map(o => o.name) };
  });
  store.set("seats", S.seats);
}
function toggleCarry(i, j) {
  const c = S.carry && S.carry[i]; if (!c || !c.allow) return;
  const at = c.pick.indexOf(j);
  if (at >= 0) c.pick.splice(at, 1);
  else {
    if (c.opts[j].k === "gear") c.pick = c.pick.filter(x => c.opts[x].k !== "gear");
    c.pick.push(j);
    while (c.pick.length > c.allow) c.pick.shift();
  }
  applyCarry();
}
function keptText(k) { return k ? [...(k.dogs || []), ...(k.gear || [])].join(", ") : ""; }
function carryHTML(g) {
  if (!S.carry) return "";
  return `<div class="carry"><div class="label">Carry-over to the next race</div>
    <p class="small">Winner keeps 1 card. Every other musher who finished keeps 2. Scratched mushers keep nothing. At most 1 gear. Tap to change.</p>
    ${S.carry.map((c, i) => { const p = g.players[i]; return `<div class="carryrow"><div><b style="color:${p.color}">${esc(p.name)}</b> <span class="small">${c.why === "scratched" ? "scratched · keeps nothing" : `${c.why === "winner" ? "winner · keeps 1" : "keeps 2"} · ${c.pick.length}/${c.allow} picked`}</span></div>
      ${c.allow ? `<div class="cards mini">${c.opts.map((o, j) => o.k === "dog"
        ? dogCard(o.card, { pick: true, flat: true, state: "rested", sel: c.pick.includes(j), attrs: `data-act="carrypick" data-p="${i}" data-o="${j}"` })
        : gearCard(o.card, { pick: true, sel: c.pick.includes(j), attrs: `data-act="carrypick" data-p="${i}" data-o="${j}"` })).join("")}</div>` : ""}</div>`; }).join("")}
  </div>`;
}

function playerChips(p) {
  const g = S.game;
  const chips = [];
  chips.push(`<span class="chip">${esc(g.label(p.pos))}</span>`);
  if (g.format === "gangline") {
    const t = p.line.filter(d => d.state === "tired").length, x = p.line.filter(d => d.state === "exh").length;
    chips.push(`<span class="chip">line ${p.line.length} · Speed ${g.gSpeed(p).total}</span>`);
    if (t) chips.push(`<span class="chip">${t} tired</span>`);
    if (x) chips.push(`<span class="chip warn">${x} exhausted</span>`);
    chips.push(`<span class="chip">${g.gHand(p).length} in hand</span>`);
    chips.push(`<span class="chip">${p.gear.length} gear${p.used.length ? ` · ${p.used.length} used` : ""}</span>`);
    if (p.longRested) chips.push(`<span class="chip ok">Long Rest done</span>`);
    if (p.skip) chips.push(`<span class="chip warn">skips next turn</span>`);
    if (p.noGo) chips.push(`<span class="chip warn">can't Go next turn</span>`);
    if (p.keptEvents.length) chips.push(`<span class="chip">${p.keptEvents.map(esc).join(", ")}</span>`);
    if (p.lost.length) chips.push(`<span class="chip warn">dropped ${p.lost.length}</span>`);
    if (p.scratched) chips.push(`<span class="chip warn">scratched</span>`);
    return chips.join("");
  }
  chips.push(`<span class="chip">${g.rested(p).length} in hand</span>`);
  if (g.tired(p).length) chips.push(`<span class="chip">${g.tired(p).length} tired</span>`);
  if (g.exh(p).length) chips.push(`<span class="chip warn">${g.exh(p).length} exhausted</span>`);
  chips.push(`<span class="chip">${p.gear.length} gear${p.used.length ? ` · ${p.used.length} used` : ""}</span>`);
  if (p.longRested) chips.push(`<span class="chip ok">Long Rest done</span>`);
  if (p.skip) chips.push(`<span class="chip warn">skips next turn</span>`);
  if (p.keptEvents.length) chips.push(`<span class="chip">${p.keptEvents.map(esc).join(", ")}</span>`);
  if (p.lost.length) chips.push(`<span class="chip warn">dropped ${p.lost.length}</span>`);
  if (p.scratched) chips.push(`<span class="chip warn">scratched</span>`);
  return chips.join("");
}
