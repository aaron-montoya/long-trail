function projection() {
  const g = S.game, pd = S.pending;
  if (!S.run || !pd) return null;
  const p = pd.p;
  const line = S.run.line.map(id => p.dogs.find(d => d.id === id)).filter(Boolean).map(d => ({ dog: d, st: d.state }));
  const gear = [...S.run.gear].map(id => p.gear.find(x => x.id === id)).filter(Boolean);
  if (!line.length) return { line, gear, pv: null };
  const pv = g.preview(p, line, gear, { stopAtHidden: true });
  return { line, gear, pv };
}

function renderStrip() {
  const g = S.game;
  const pr = projection();
  const projSet = new Set(pr && pr.pv ? pr.pv.steps.map(s => s.pos) : []);
  const end = pr && pr.pv && pr.pv.crossed ? pr.pv.end : null;
  const tok = pos => g.players.filter(p => p.pos === pos && !p.scratched).map(p => `<span class="tok" style="background:${p.color}" title="${esc(p.name)} (${esc(p.musher)})">${esc(p.name[0].toUpperCase())}</span>`).join("");
  let html = `<div class="slot"><div class="tokens">${tok(-1)}</div><div class="startcard">Start</div><div class="slotlab">Start</div></div>`;
  g.path.forEach((c, i) => {
    let lab = c.type === "CP" ? `Checkpoint ${c.cp}` : c.type === "F" ? "Finish" : `Trail ${g.trailNo(i)}${g.finalLeg(i) ? " · final" : ""}`;
    const rw = c.type === "T" && c.reward ? (c.reward.kind === "dog" ? dogCard(c.reward.card, { w: 60 }).replace('class="card', 'class="card rewmini') : gearCard(c.reward.card).replace('class="card', 'class="card rewmini')) : "";
    html += `<div class="slot ${projSet.has(i) ? (i === end ? "projend" : "proj") : ""}"><div class="tokens">${tok(i)}</div>${trailCard(c, i)}<div class="slotlab">${lab}</div>${rw}</div>`;
  });
  $("#strip").innerHTML = html;
}

function canUseFree(p, g, gr) {
  if (gr.name === "Dog Food") return g.exh(p).length > 0;
  if (gr.name === "Whistle") return g.tired(p).length > 0;
  if (gr.name === "Hot Broth") return g.tired(p).length > 0;
  if (gr.name === "Headlamp") return g.nextFaceDown(p, 1).length > 0;
  return false;
}

function boardPlayer() {
  const g = S.game, pd = S.pending;
  const myTurn = !!(pd && pd.req.type === "action" && !pd.p.bot);
  const p = myTurn ? pd.p : S.viewer;
  if (!p || (humans().length > 1 && !(g.current === p && !p.bot) && !myTurn)) return { p: null, myTurn };
  return { p, myTurn };
}

function renderBoard() {
  const g = S.game, el = $("#board"), rp = $("#runpanel");
  const { p, myTurn } = boardPlayer();
  if (!p) {
    const cur = g.current;
    el.innerHTML = `<div class="waiting">${g.over ? "The race is over." : cur ? `<b style="color:${cur.color}">${esc(cur.name)}</b> is on the trail…` : "…"}</div>`;
    rp.innerHTML = `<div class="waiting" style="padding:8px">${g.over ? "Race over." : "Waiting for the next musher."}</div>`;
    return;
  }
  if (g.format === "gangline") return renderGBoard(p, myTurn);
  const rested = g.rested(p), tired = g.tired(p), exh = g.exh(p);
  const run = myTurn ? S.run : null;
  const inLine = id => !!(run && run.line.includes(id));
  const full = !!(run && g.rules.lineMax && run.line.length >= g.rules.lineMax);
  const pickable = d => run && !full && d.state !== "exh" && !inLine(d.id);

  // ---- in front of you (public)
  const tz = [];
  if (tired.length) tz.push(`<div class="tz"><div class="label">Tired · ${tired.length}</div><div class="row">${tired.map(d => dogCard(d, { pick: pickable(d), dim: inLine(d.id), attrs: pickable(d) ? `data-act="adddog" data-id="${d.id}"` : "", flag: inLine(d.id) ? "in line" : null })).join("")}</div></div>`);
  if (exh.length) tz.push(`<div class="tz"><div class="label">Exhausted · ${exh.length}</div><div class="row">${exh.map(d => dogCard(d, {})).join("")}</div></div>`);
  if (p.used.length) tz.push(`<div class="tz"><div class="label">Used gear · back at your Long Rest</div><div class="row">${p.used.map(gr => gearCard(gr, { used: true })).join("")}</div></div>`);
  if (p.keptEvents.length) tz.push(`<div class="tz"><div class="label">Kept Events · next Run</div><div class="row">${p.keptEvents.map(e => eventCard(e)).join("")}</div></div>`);

  // ---- the hand (private): dogs, then gear
  const items = [];
  rested.forEach(d => items.push({ kind: "dog", html: dogCard(d, { pick: pickable(d), attrs: pickable(d) ? `data-act="adddog" data-id="${d.id}"` : "" }), inline: inLine(d.id) }));
  p.gear.forEach((gr, j) => {
    const runG = !!(run && gr.when === "run");
    const free = myTurn && !run && gr.when === "free" && canUseFree(p, g, gr);
    items.push({ kind: "gear", gap: j === 0 && rested.length > 0, inline: false,
      html: gearCard(gr, { pick: runG, sel: !!(run && run.gear.has(gr.id)), attrs: runG ? `data-act="togglegear" data-id="${gr.id}"` : "" })
        + (free ? `<button class="usebtn" data-act="usegear" data-id="${gr.id}">Use</button>` : "") });
  });
  const n = items.length;
  const step = Math.min(4, 20 / Math.max(n, 1));
  const maxDy = Math.pow((n - 1) / 2, 2) * step * 0.9;
  const hand = items.map((it, i) => {
    const o = i - (n - 1) / 2;
    return `<div class="hc ${it.inline ? "inline" : ""} ${it.gap ? "gap" : ""}">${it.html}</div>`;
  }).join("");

  el.innerHTML = `
    <div class="musherrow">
      ${musherCard(p)}
      <div class="mtext">
        <h2 style="color:${p.color}">${esc(p.name)} <span class="small">· ${esc(p.musher)}</span></h2>
        <div class="small">${esc(g.label(p.pos))}${myTurn ? " · your turn" : ""}${p.lost.length ? ` · dropped: ${p.lost.map(d => esc(d.name)).join(", ")}` : ""}</div>
        <div class="side ${p.after ? "off" : "on"}"><b>Before Long Rest.</b> ${esc(musherT(p.musher)[0])}</div>
        <div class="side ${p.after ? "on" : "off"}"><b>After Long Rest.</b> ${esc(musherT(p.musher)[1])}</div>
      </div>
    </div>
    <div class="tableau" aria-label="In front of you">${tz.join("") || `<span class="empty">Nothing in front of you. Every dog is rested.</span>`}</div>
    <div class="handzone">
      <div class="label">Your hand · ${rested.length} dog${rested.length === 1 ? "" : "s"}, ${p.gear.length} gear${run ? " · tap dogs to add them to your line" : " · tap a card to look closer"}</div>
      <div class="hand" id="hand">${hand || `<span class="empty">Your hand is empty.</span>`}</div>
    </div>`;
  fitHand();

  if (myTurn) rp.innerHTML = run ? runPanelHTML(p) : actionsHTML(p);
  else rp.innerHTML = `<div class="waiting" style="padding:8px">${g.current ? `<b style="color:${g.current.color}">${esc(g.current.name)}</b> is taking their turn…` : ""}</div>`;
}


// ---------------- Gangline mode board ----------------
function gState() { return S.g || (S.g = { sel: null, gear: new Set(), ret: new Set() }); }
function renderGBoard(p, myTurn) {
  const g = S.game, el = $("#board"), rp = $("#runpanel");
  const st = myTurn ? gState() : { sel: null, gear: new Set(), ret: new Set() };
  const hand = g.gHand(p);
  const stName = d => d.state === "rested" ? "rested" : d.state === "tired" ? "tired" : "exhausted";
  const canHitch = myTurn && !p.hitched && hand.length && (!g.rules.lineMax || p.line.length < g.rules.lineMax);
  const lineHTML = p.line.map((d, i) => `<div class="gslot">${dogCard(d, { flag: stName(d) })}<div class="gpos">${i === 0 ? "Front · Lead" : i === p.line.length - 1 ? "Back · Wheel" : "#" + (i + 1)}</div></div>`).join("");
  const tz = [];
  if (p.used.length) tz.push(`<div class="tz"><div class="label">Used gear · back at your Long Rest</div><div class="row">${p.used.map(gr => gearCard(gr, { used: true })).join("")}</div></div>`);
  if (p.keptEvents.length) tz.push(`<div class="tz"><div class="label">Kept Events · next Go</div><div class="row">${p.keptEvents.map(e => eventCard(e)).join("")}</div></div>`);
  const items = [];
  hand.forEach(d => items.push(`<div class="hc">${dogCard(d, { pick: !!canHitch, sel: st.sel === d.id, attrs: canHitch ? `data-act="gsel" data-id="${d.id}"` : "", state: "rested" })}</div>`));
  p.gear.forEach((gr, j) => {
    const runG = myTurn && gr.when === "run";
    const free = myTurn && gr.when === "free" && canUseFree(p, g, gr);
    items.push(`<div class="hc ${j === 0 && hand.length ? "gap" : ""}">${gearCard(gr, { pick: runG, sel: st.gear.has(gr.id), attrs: runG ? `data-act="ggear" data-id="${gr.id}"` : "" })}${free ? `<button class="usebtn" data-act="usegear" data-id="${gr.id}">Use</button>` : ""}</div>`);
  });
  el.innerHTML = `
    <div class="musherrow">
      ${musherCard(p)}
      <div class="mtext">
        <h2 style="color:${p.color}">${esc(p.name)} <span class="small">· ${esc(p.musher)}</span></h2>
        <div class="small">${esc(g.label(p.pos))}${myTurn ? " · your turn" : ""}${p.lost.length ? ` · dropped: ${p.lost.map(d => esc(d.name)).join(", ")}` : ""}</div>

function gActionsHTML(p, st) {

  else goSub = `Move onto ${g.label(n.nxt)}. Your Lead tires. Keep going while your Speed covers the next trail.`;
  h += btn("ggo", "Go", goSub + (gearSel.length ? ` With ${gearSel.map(x => x.name).join(", ")}.` : ""), { primary: !!(n && n.ok && !noGo && !L.mustLongRest), disabled: !(n && n.ok) || noGo || L.mustLongRest });
  h += btn("gcamp", "Camp", `Every dog in your line recovers one step (exhausted → tired → rested)${safeCamp ? ". No Event here." : ", then draw an Event."}`, { disabled: L.mustLongRest });
  h += `</div>`;
  if (bivy && !safeCamp) h += `<label><input type="checkbox" id="usebivy"> Use Bivy Sack if you camp (no Event)</label>`;

  return h;
}

function fitHand() {
  return; // cards sit side by side now; nothing to fit
  const h = $("#hand"); if (!h) return;
  const cards = h.querySelectorAll(".hc");
  if (cards.length < 2) return;
  const w = cards[0].getBoundingClientRect().width / Math.max(.5, Math.cos(0)) || 120;
  const cw = cards[0].offsetWidth || w;
  const maxRot = (+h.dataset.maxrot || 0) * Math.PI / 180;
  const swing = Math.sin(maxRot) * (cards[0].offsetHeight || cw * 1.4) * 1.3; // rotated edge cards lean outward
  const avail = h.clientWidth - 24 - 2 * swing;
  const natural = cw * 0.72; // a little overlap even when there's room, so it reads as a hand
  const per = Math.min(natural, (avail - cw - (h.querySelector(".hc.gap") ? 16 : 0)) / (cards.length - 1));
  h.style.setProperty("--ov", `${(per - cw).toFixed(1)}px`);
}
window.addEventListener("resize", () => { if (S.screen === "game") fitHand(); });

    h += btn("slog", "Slog", L.canSlog ? `Move 1 trail without dogs.${vetSafe ? " No Event (Veteran)." : lantern ? " Red Lantern can skip the Event." : " Draw an Event."} Once per leg.` : slogWhy, { disabled: !L.canSlog });
    if (lantern && L.canSlog && !vetSafe) h += `<label><input type="checkbox" id="uselantern" checked> Use Red Lantern on this Slog</label>`;

// Reasons a trail costs this musher something other than its printed number.
function costWhy(g, p, i, line, gear) {
  const c = g.path[i], r = [];
  if (!c || c.type !== "T") return r;
  const ahead = g.players.filter(q => q !== p && !q.scratched && q.pos >= i);
  if (ahead.length) r.push(`−${c.name === "Deep Powder" ? 3 : 1} drafting (${ahead.map(q => esc(q.name)).join(", ")} ahead)`);
  else if (p.musher === "Trailbreaker") r.push(`−${p.after ? 1 : 2} Trailbreaker (nobody's been here)`);
  const wheels = line.filter(x => x.st === "rested" && x.dog.role === "Wheel");
  if (c.name === "Mountain Pass" && wheels.length) r.push(`−${wheels.reduce((s2, x) => s2 + x.dog.rs, 0)} rested Wheel dogs (${wheels.map(x => esc(x.dog.name)).join(", ")})`);
  if (line.some(x => x.st === "rested" && x.dog.ab === "nanook") && (c.name === "Spruce Forest" || c.name === "Exposed Ridge")) r.push("−1 Nanook");
  if (p.musher === "Veteran" && p.after && g.finalLeg(i)) r.push("−1 Veteran");
  if (p.costMod) r.push(`+${p.costMod} Fresh Snow`);
  if (gear.some(x => x.name === "Wax the Runners")) r.push("−1 Wax the Runners");
  if (gear.some(x => x.name === "Snow Hook") && (c.name === "Mountain Pass" || c.name === "Deep Powder")) r.push("−2 Snow Hook");
  return r;
}

// What the next trail costs this musher, and how much of that the dogs must cover.
function targetInfo(g, p, line, gear) {
  let i = p.pos + 1;
  if (p.pos >= 0 && g.path[p.pos].type === "CP" && !g.canPassCP(p, p.pos)) return null;
  if (i >= g.path.length) return null;
  if (g.path[i].type === "CP") i++;
  const c = g.path[i];
  const cost = g.trailCost(p, i, line, gear);
  const printed = c.type === "F" ? LT.FINISH_COST : c.cost;
  const reasons = costWhy(g, p, i, line, gear);
  if (cost === 1 && printed > 1 && reasons.length) reasons.push("can't go below 1");
  const sp = g.speedOf(p, line, gear);
  const dogSet = new Set(line.map(x => x.dog.name));
  const extra = sp.parts.filter(([w]) => !dogSet.has(w) && !/\(tired\)$/.test(w) && w !== "Lead bonus" && w !== "Wheel bonus");
  const extraSum = extra.reduce((s2, x) => s2 + x[1], 0);
  return { i, name: c.type === "F" ? "the Finish" : `${esc(c.name)} (trail ${g.trailNo(i)})`, cost, printed, reasons, extra,
    need: Math.max(0, cost - extraSum), dogSpeed: sp.total - extraSum };
}

function runPanelHTML(p) {
  const g = S.game;
  const pr = projection();
  const run = S.run;
  const lineDogs = run.line.map(id => p.dogs.find(d => d.id === id)).filter(Boolean);
  const n = lineDogs.length;
  const yukonBad = lineDogs.some((d, i) => d.ab === "lastonly" && d.state === "rested" && i !== n - 1);
  // per-dog Speed (first n parts are the dogs, in order)
  const per = pr && pr.pv ? pr.pv.parts.slice(0, n).map(x => x[1]) : [];
  const lb = pr && pr.pv ? (pr.pv.parts.find(x => x[0] === "Lead bonus") || [0, 0])[1] : 0;
  const wb = pr && pr.pv ? (pr.pv.parts.find(x => x[0] === "Wheel bonus") || [0, 0])[1] : 0;

  // zigzag: back dog bottom-left, each dog further forward sits in the other column, half a card higher
  const W = innerWidth < 900 ? Math.max(90, Math.min(150, Math.floor((innerWidth - 136) / 2))) : 165, H = Math.round(W * 88 / 63), GAP = 8, SIDE = 34;
  let line;
  if (!n) line = `<div class="emptyline">Tap dogs in your hand, or tired dogs in front of you. The first dog you add runs at the front.</div>`;
  else {
    const height = (n - 1) * H / 2 + H;
    const cards = lineDogs.map((d, i) => {
      const k = n - 1 - i;                  // 0 = back of the line
      const right = k % 2 === 1;
      const left = right ? (SIDE + W + GAP) : 0;
      const bottom = k * H / 2;
      let bonus = per[i] != null ? per[i] : 0;
      if (i === 0) bonus += lb;
      if (i === n - 1) bonus += wb;
      const role = i === 0 ? "front" : i === n - 1 ? "back" : "";
      return `<div class="zz ${right ? "r" : "l"}" draggable="true" data-drag="${d.id}" style="left:${left}px;bottom:${bottom}px;z-index:${n - k}">
          ${dogCard(d, { flat: true })}
          <div class="zzctl">
            <span class="zznum" title="Position in line">${i + 1}</span>
            <span class="zzspd" title="Speed this dog adds${role ? ", including its " + (role === "front" ? "Lead" : "Wheel") + " bonus" : ""}">+${bonus}</span>
            <button data-act="mv" data-id="${d.id}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="Move toward the front" title="Toward the front">▲</button>
            <button data-act="rmdog" data-id="${d.id}" aria-label="Take out of line" title="Take out">✕</button>
            <button data-act="mv" data-id="${d.id}" data-d="1" ${i === n - 1 ? "disabled" : ""} aria-label="Move toward the back" title="Toward the back">▼</button>
          </div>
        </div>`;
    }).join("");
    line = `<div class="zzbox" style="--zw:${W}px;--side:${SIDE}px;width:${2 * (W + SIDE) + GAP}px;height:${height}px">${cards}</div>`;
  }

  // run gear
  const runGear = p.gear.filter(x => x.when === "run");
  const gearHTML = runGear.length ? `<div class="rungear"><div class="label">Gear for this Run</div><div class="gearpills">${runGear.map(gr => `<label class="${run.gear.has(gr.id) ? "on" : ""}" title="${esc(gr.text)}"><input type="checkbox" data-act="togglegear" data-id="${gr.id}" ${run.gear.has(gr.id) ? "checked" : ""}><span><b>${esc(gr.name)}</b> <small>${esc(gr.text)}</small></span></label>`).join("")}</div></div>` : "";

  const ti = targetInfo(g, p, lineDogs.map(d => ({ dog: d, st: d.state })), [...run.gear].map(id => p.gear.find(x => x.id === id)).filter(Boolean));
  let ok = false, after = "";
  if (pr && pr.pv) {
    const pv = pr.pv;
    let where;
    if (pv.finished) where = `<b>Reaches the Finish and wins!</b>`;
    else if (pv.crossed) where = `Reaches <b>${esc(g.label(pv.end))}</b> with ${pv.left} Speed left${pv.hiddenNext ? " for the face-down trail ahead" : ""}.`;
    else where = `<b style="color:var(--bad)">Not enough Speed for the next trail's Difficulty${pv.tankBlock ? " (Tank won't step onto River Ice)" : ""}.</b>`;
    const pushed = pr.line.filter(x => x.st === "tired").length;
    const booties = pr.gear.some(x => x.name === "Booties");
    const perDog = true;
    const evs = pushed ? (booties ? "Booties: no push Events." : `Pushing ${pushed} tired dog${pushed > 1 ? "s" : ""}: draw ${perDog ? pushed : 1} Event${perDog && pushed > 1 ? "s" : ""} after.`) : "No tired dogs, no push Event.";
    const ri = pr.line.length >= 3 && pv.steps.some(s => g.path[s.pos].type === "T" && g.path[s.pos].name === "River Ice") && !g.shadowSafe(p) && !pr.line.some(x => x.st === "rested" && x.dog.ab === "shadow") ? " River Ice with 3+ dogs draws an Event." : "";
    const later = pv.steps.filter(st => g.path[st.pos].type !== "CP").slice(1).map(st => {
      const c = g.path[st.pos];
      const label = c.type === "F" ? "Finish" : `${esc(c.name)}`;
      const printed = c.type === "F" ? LT.FINISH_COST : c.cost;
      const w = costWhy(g, p, st.pos, pr.line, pr.gear);
      return `<span class="tchip" title="${esc(w.join(", "))}">then ${label} ${st.cost}${st.cost !== printed ? ` <s>${printed}</s>` : ""}</span>`;
    }).join("");
    const cp2 = g.cpIdx[1];
    let vetWarn = "";
    if (g.rules.vetCheck && p.pos < cp2 && pv.steps.some(s2 => s2.pos === cp2)) {
      const goners = [...g.exh(p), ...pr.line.filter(x => x.st === "tired").map(x => x.dog)];
      vetWarn = goners.length ? `<div class="warn">Vet check at Checkpoint 2 will drop: ${goners.map(d => esc(d.name)).join(", ")}.</div>` : `<div class="breakdown">Vet check at Checkpoint 2: your team would pass.</div>`;
    }
    after = `<div class="sumafter">
        <div>Total Speed <b>${pv.speed}</b>. ${where}</div>
        ${later ? `<div class="chips2">${later}</div>` : ""}
        <div class="breakdown">${evs}${ri}</div>
        ${vetWarn}${yukonBad ? `<div class="warn">Yukon must run last.</div>` : ""}
      </div>`;
    ok = pv.crossed >= 1 && !yukonBad;
  }
  let summary = "";
  if (ti) {
    const verdict = !n ? `<span class="small">Add dogs below</span>` : ti.dogSpeed >= ti.need ? `<span class="ok">✓ enough</span>` : `<span class="short">${ti.need - ti.dogSpeed} short</span>`;
    const costChips = (ti.cost !== ti.printed || ti.reasons.length) ? `<span class="tchip">printed ${ti.printed}</span>${ti.reasons.map(r => `<span class="tchip">${r}</span>`).join("")}` : "";
    const bonusChips = ti.extra.map(([w, v]) => `<span class="tchip plus">+${v} ${esc(w)}</span>`).join("");
    summary = `<div class="summary">
      <div class="label">Next trail · ${ti.name}</div>
      <div class="vs">
        <div class="col"><div class="k">Your dogs need</div><div class="big">${ti.need}</div>${ti.extra.length ? `<div class="small">trail Difficulty ${ti.cost}</div>` : ""}</div>
        <div class="col"><div class="k">Your dogs have</div><div class="big ${!n ? "" : ti.dogSpeed >= ti.need ? "ok" : "short"}">${n ? ti.dogSpeed : "–"}</div>${n && (lb || wb) ? `<div class="small">incl. ${[lb ? "Lead +" + lb : "", wb ? "Wheel +" + wb : ""].filter(Boolean).join(", ")}</div>` : ""}</div>
        <div class="verdict">${verdict}</div>
      </div>
      ${costChips || bonusChips ? `<div class="chips2">${costChips}${bonusChips}</div>` : ""}
      ${after}
    </div>`;
  } else if (after) summary = `<div class="summary">${after}</div>`;
  const cap = g.rules.lineMax ? `<div class="small" style="text-align:center">${n} of ${g.rules.lineMax} gangline spots used</div>` : "";
  const seenF = new Set();
  const freeNow = p.gear.filter(gr => gr.when === "free" && canUseFree(p, g, gr) && !seenF.has(gr.name) && seenF.add(gr.name));
  const freeHTML = freeNow.length ? `<div class="rungear"><div class="label">Use first</div><div class="gearpills">${freeNow.map(gr => `<button class="act" data-act="usegear" data-id="${gr.id}" style="text-align:left"><b>Use ${esc(gr.name)}</b> <small style="color:var(--muted)">${esc(gr.text)}</small></button>`).join("")}</div></div>` : "";
  return `<h3>Set up your Run</h3>
    ${summary}
    <div class="runbtns">
      <button class="primary" data-act="go" ${ok ? "" : "disabled"}>Run!</button>
      <button data-act="autoline">Suggest a line</button>
      <button data-act="clearline" ${n ? "" : "disabled"}>Clear</button>
      <button data-act="cancelrun">Back</button>
    </div>
    ${freeHTML}
    ${gearHTML}
    ${cap}
    <div class="lineend">Front of the line</div>
    ${line}
    <div class="lineend">Sled</div>`;
}

let logCount = 0;
function renderLog(full) {
  const g = S.game, el = $("#log"); if (!g || !el) return;
  if (full) { el.innerHTML = ""; logCount = 0; }
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.querySelectorAll(".fresh").forEach(x => x.classList.remove("fresh"));
  const frag = document.createDocumentFragment();
  for (; logCount < g.logLines.length; logCount++) {
    const l = g.logLines[logCount];
    const d = document.createElement("div");
    d.className = (l.cls || "") + (full ? "" : " fresh");
    d.textContent = l.cls === "round" ? l.msg : l.msg;
    frag.appendChild(d);
  }
  el.appendChild(frag);
  const last = g.logLines[g.logLines.length - 1]; const ll = $("#loglast"); if (ll && last) ll.textContent = last.msg;
  if (atBottom || full) el.scrollTop = el.scrollHeight;
}

// ---------------- Modals ----------------
function modal(html) { $("#modal").innerHTML = `<div class="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function renderModal() {
  const m = $("#modal"); if (!m) return;
  const g = S.game, ov = S.overlay, pd = S.pending;
  if (ov) {
    if (ov.type === "pass") return modal(`<div class="pass"><div class="label">Pass the screen</div><div class="who" style="color:${ov.p.color}">${esc(ov.p.name)}</div><p class="small">Everyone else, look away. ${esc(ov.p.name)} plays the ${esc(ov.p.musher)}.</p><button class="primary" data-act="passok">I'm ${esc(ov.p.name)}, show my hand</button></div>`);
    if (ov.type === "over") {
      const w = g.winner;
      return modal(`<h3>${w ? `${esc(w.name)} wins the Long Trail!` : "The trail wins this time."}</h3>
        <p class="small">${g.round} rounds · ${g.stats.events} Events drawn · ${g.stats.removed} dogs dropped.</p>
        <p><b>Race time ${fmt(T.active())}</b> · about ${fmt(T.active() / Math.max(1, g.round))} per round.</p>
        <table class="times"><thead><tr><th>Musher</th><th>Turns</th><th>Time on turns</th><th>Per turn</th></tr></thead><tbody>
        ${g.players.map(p => `<tr><td><b style="color:${p.color}">${esc(p.name)}</b>${p.bot ? " (bot)" : ""}</td><td>${T.turns[p.idx]}</td><td>${fmt(T.per[p.idx])}</td><td>${T.turns[p.idx] ? fmt(T.per[p.idx] / T.turns[p.idx]) : "–"}</td></tr>`).join("")}
        </tbody></table>
        ${g.players.some(p => p.bot) ? `<p class="small">Bot turns count toward the race time at the bot speed you picked. For a table estimate, look at the human per-turn times.</p>` : ""}
        <ul>${g.players.map(p => `<li><b style="color:${p.color}">${esc(p.name)}</b> (${esc(p.musher)}): ${p.scratched ? "scratched" : esc(g.label(p.pos))}, ${p.dogs.length} dogs left${p.lost.length ? `, dropped ${p.lost.map(d => esc(d.name)).join(", ")}` : ""}</li>`).join("")}</ul>
        ${carryHTML(g)}
        <div class="btns"><button data-act="closeover">Look at the board</button><button data-act="newrace">Back to setup</button><button class="primary" data-act="rematch">Next race with kept cards</button></div>`);
    }
    if (ov.type === "rules") return modal(rulesHTML());
    if (ov.type === "paused") return modal(`<div class="pass"><div class="label">Race paused</div><div class="who">⏱ ${fmt(T.active())}</div><p class="small">The clock and the bots are stopped.</p><button class="primary" data-act="pause">Resume</button></div>`);
    if (ov.type === "freepick") {
      const p = ov.p;
      return modal(`<h3>${esc(ov.gear.name)}</h3><p class="small">${esc(ov.gear.text)} Pick a dog.</p><div class="cards">${ov.options.map(d => dogCard(d, { pick: true, attrs: `data-act="freepickdog" data-id="${d.id}"`, state: "rested" })).join("")}</div><div class="btns"><button data-act="closeov">Cancel</button></div>`);
    }
    if (ov.type === "artcheck") return modal(ov.html);
    if (ov.type === "zoom") return modal(zoomHTML(ov.spec) + `<div class="btns" style="margin-top:12px"><button class="primary" data-act="closezoom">Close</button></div>`);
  }
  if (!pd || pd.p.bot || pd.req.type === "action") { m.innerHTML = ""; return; }
  const r = pd.req, p = pd.p;
  const findDog = id => p.dogs.find(d => d.id === id) || (r.cards || []).find(d => d.id === id);
  switch (r.type) {
    case "event":
      return modal(`<div class="label">${esc(p.name)} · Event from ${esc(r.source)}</div><h3>${esc(r.card)}</h3>
        <div class="cards">${eventCard(r.card)}</div><p>${esc(evText(r.card))}</p>${r.ignored ? `<p class="small" style="color:var(--good)">${esc(r.ignored)}</p>` : ""}
        ${g.finalLeg(p.pos) && !g.rules.noHarsh && /[Rr]emove/.test(evText(r.card)) && !r.ignored ? `<p class="small" style="color:var(--bad)">Harsh weather: this drops 2 dogs on the final leg.</p>` : ""}
        <div class="btns"><button class="primary" data-act="ok">OK</button></div>`);
    case "pickEvent":
      return modal(`<div class="label">${esc(p.name)} · ${p.musher === "Gambler" ? "Gambler" : "Cocoa"} · Event from ${esc(r.source)}</div><h3>Choose one Event</h3>
        <div class="cards">${r.options.map((e, i) => eventCard(e, { pick: true, attrs: `data-act="pick" data-v="${i}"` })).join("")}</div>`);
    case "rookieIgnore":
      return modal(`<div class="label">${esc(p.name)} · Event from ${esc(r.source)}</div><h3>${esc(r.card)}</h3><div class="cards">${eventCard(r.card)}</div><p>${esc(evText(r.card))}</p>
        <p class="small">Rookie: once per leg you may ignore an Event.</p>
        <div class="btns"><button data-act="pick" data-v="0">Take it</button><button class="primary" data-act="pick" data-v="1">Ignore it</button></div>`);
    case "gContinue":
      return modal(`<div class="label">${esc(p.name)} · Go</div><h3>Keep going?</h3>
        <p>Your team's Speed is now <b>${r.speed}</b>. ${esc(r.label)} has Difficulty <b>${r.cost}</b>.</p>
        <p class="small">If you keep going, your Lead tires again.</p>
        <div class="btns"><button data-act="pick" data-v="0">Stop here</button><button class="primary" data-act="pick" data-v="1">Keep going</button></div>`);
    case "alpineIgnore":
      return modal(`<div class="label">${esc(p.name)} · Event from ${esc(r.source)}</div><h3>${esc(r.card)}</h3><div class="cards">${eventCard(r.card)}</div><p>${esc(evText(r.card))}</p>
        <p class="small">Alpine ran this turn: you may ignore one Event you draw this turn.</p>
        <div class="btns"><button data-act="pick" data-v="0">Take it</button><button class="primary" data-act="pick" data-v="1">Ignore it</button></div>`);
    case "removeDog": case "exhaustDog": {
      const ids = r.all || r.options;
      const stateName = d => d.state === "rested" ? "rested" : d.state === "tired" ? "tired" : "exhausted";
      const cards = ids.map(findDog).filter(Boolean).sort((a, b) => (r.options.includes(b.id) ? 1 : 0) - (r.options.includes(a.id) ? 1 : 0))
        .map(d => r.options.includes(d.id)
          ? dogCard(d, { pick: true, flat: true, attrs: `data-act="pick" data-v="${d.id}"`, flag: stateName(d) })
          : dogCard(d, { flat: true, dim: true, flag: stateName(d) })).join("");
      const harsh = r.n > 1 ? ` (${r.k} of ${r.n}, harsh weather)` : "";
      return modal(`<div class="label">${esc(p.name)} · ${esc(r.cause)}${harsh}</div><h3>${r.type === "removeDog" ? "Choose a dog to drop" : "Choose a tired dog to exhaust"}</h3>
        <p class="small">${esc(r.reason || "")} Tap a bright card to choose it.${r.options.length === 1 ? " Only one dog can be chosen right now." : ""}</p>
        <div class="cards">${cards}</div>`);
    }
    case "keepDogs": {
      const sel = S.keepSel || (S.keepSel = new Set());
      return modal(`<div class="label">${esc(p.name)} · ${esc(r.source)}</div><h3>Keep ${r.keep} of these dogs</h3>
        <div class="cards">${r.cards.map(d => dogCard(d, { pick: true, sel: sel.has(d.id), attrs: `data-act="keeptoggle" data-id="${d.id}"`, state: "rested" })).join("")}</div>
        <div class="btns"><span class="small" style="align-self:center">${sel.size} of ${r.keep} chosen</span><button class="primary" data-act="keepok" ${sel.size === r.keep ? "" : "disabled"}>Keep these</button></div>`);
    }
    case "keepGear":
      return modal(`<div class="label">${esc(p.name)} · Long Rest</div><h3>Keep one gear</h3><div class="cards">${r.cards.map(c => gearCard(c, { pick: true, attrs: `data-act="pick" data-v="${c.id}"` })).join("")}</div>`);
    case "lostBootie":
      return modal(`<div class="label">${esc(p.name)} · Lost Bootie</div><h3>Choose a gear to lose</h3><div class="cards">${p.gear.map(c => gearCard(c, { pick: true, attrs: `data-act="pick" data-v="${c.id}"` })).join("")}</div>`);
    case "tinker":
      return modal(`<div class="label">${esc(p.name)} · ${esc(r.source || "Tinker")}</div><h3>Return one used gear to your hand</h3><div class="cards">${p.used.filter(c => r.options.includes(c.id)).map(c => gearCard(c, { pick: true, attrs: `data-act="pick" data-v="${c.id}"` })).join("")}</div>`);
    case "sledBasket": {
      const d = findDog(r.dog);
      return modal(`<div class="label">${esc(p.name)} · ${esc(r.cause)}</div><h3>Use your Sled Basket?</h3><div class="cards">${dogCard(d, { flat: true })}</div>
        <p>${esc(d.name)} would be dropped. The Sled Basket makes it exhausted instead. The Basket becomes used gear and comes back at your Long Rest.</p>
        <div class="btns"><button data-act="pick" data-v="0">Let it go</button><button class="primary" data-act="pick" data-v="1">Use Sled Basket</button></div>`);
    }
    case "stopAtCP":
      return modal(`<div class="label">${esc(p.name)} · Run</div><h3>You reach Checkpoint ${r.cp}</h3>
        <p>You have <b>${r.left}</b> Speed left and the next trail's Difficulty is <b>${r.nextCost}</b>. Stop here to camp at the checkpoint next turn, or keep running?</p>
        <div class="btns"><button data-act="pick" data-v="0">Stop at Checkpoint ${r.cp}</button><button class="primary" data-act="pick" data-v="1">Keep going</button></div>`);
    case "vetCheck":
      return modal(`<div class="label">${esc(p.name)} · Checkpoint 2</div><h3>Vet check</h3>
        ${r.cards.length ? `<p>The vet sends home every exhausted dog and every dog you pushed to get here.${r.scratched ? " <b>That was your whole team. You're scratched.</b>" : ""}</p>
          <div class="cards">${r.cards.map(d => dogCard(d, { flat: true, flag: "dropped" })).join("")}</div>` : `<p>Every dog passes. Nobody is dropped.</p>`}
        <div class="btns"><button class="primary" data-act="ok">OK</button></div>`);
    case "peek":
      return modal(`<div class="label">${esc(p.name)} · ${esc(r.source)} · only you see this</div><h3>${r.trails.length ? "The trail ahead" : "Nothing left to see"}</h3>
        <div class="cards">${r.trails.map(i => `<div style="text-align:center">${trailCard(g.path[i], i, { reveal: true })}<div class="small">Trail ${g.trailNo(i)}</div></div>`).join("")}</div>
        <div class="btns"><button class="primary" data-act="ok">Got it</button></div>`);
  }
  m.innerHTML = "";
}

function zoomHTML(spec) {
  const [kind, a, b, c] = spec.split("|");
  if (kind === "dog") {
    const r = LT.DOGS.find(x => x[0] === a); if (!r) return "";
    const ga = gAlt("dog", r[0]);
    const d = { name: r[0], role: r[1], rs: r[2], ts: r[3], ab: r[4], text: ga ? ga[0] : r[5], tt: ga ? ga[1] : (r[6] || "") };
    return `<div class="zoomview">${dogCard(d, { state: "rested", flat: true })}<div class="zt"><div class="label">${d.role} dog${b && b !== "rested" ? " · " + (b === "exh" ? "exhausted" : b) : ""}</div><h3>${esc(d.name)}</h3>
      <p>Rested Speed <b>${d.rs}</b> · Tired Speed <b>${d.ts}</b></p>${d.text ? `<p><b>Rested:</b> ${esc(d.text)}</p>` : ""}${d.tt ? `<p><b>Tired:</b> ${esc(d.tt)}</p>` : ""}${!d.text && !d.tt ? `<p class="small">No ability.</p>` : ""}
      <p class="small">${d.role === "Lead" ? "Lead: +1 Speed when it runs first with at least one dog behind it, rested or tired." : d.role === "Wheel" ? "Wheel: +1 Speed when it runs last with at least one dog ahead of it, rested or tired." : "Team: no position bonus."} Abilities only work while the dog is rested, unless they're printed on the tired half too.</p></div></div>`;
  }
  if (kind === "gear") {
    const r0 = LT.GEAR.find(x => x[0] === a); if (!r0) return "";
    const r = gAlt("gear", a) ? [r0[0], r0[1], r0[2], gAlt("gear", a)] : r0;
    const pd = S.pending, me = pd && pd.req.type === "action" && !pd.p.bot ? pd.p : null;
    const mine = me && me.gear.find(x => x.name === a && x.when === "free" && canUseFree(me, S.game, x));
    const why = me && me.gear.some(x => x.name === a) && !mine ? (r[2] === "run" ? "Tick it under “Gear for this Run” when you set up a Run." : r[2] === "camp" ? "Used when you Camp in the open (tick the box under Camp)." : r[2] === "slog" ? "Used when you Slog (tick the box under Slog)." : r[2] === "react" ? "You'll be asked to use it when a dog would be dropped." : "Nothing for it to do right now.") : "";
    return `<div class="zoomview">${gearCard({ name: r[0], text: r[3] })}<div class="zt"><div class="label">Gear · ${r[1]} in the deck</div><h3>${esc(r[0])}</h3><p>${esc(r[3])}</p>
      ${mine ? `<button class="primary" data-act="usegear" data-id="${mine.id}" style="margin-top:10px">Use ${esc(a)} now</button>` : why ? `<p class="small">${why}</p>` : ""}</div></div>`;
  }
  if (kind === "event") {
    const r = (isG() ? LT.G_EVENTS : LT.EVENTS).find(x => x[0] === a); if (!r) return "";
    return `<div class="zoomview">${eventCard(a)}<div class="zt"><div class="label">Event · ${r[1]} in the deck</div><h3>${esc(a)}</h3><p>${esc(r[2])}</p>${isG() ? "" : `<p class="small">On the final leg, an Event that drops a dog drops 2.</p>`}</div></div>`;
  }
  if (kind === "musher") {
    const t = musherT(a);
    return `<div class="zoomview">${musherCard({ musher: a, after: false })}<div class="zt"><div class="label">Musher</div><h3>${esc(a)}</h3>
      <p class="${b === "1" ? "small" : ""}"><b>Before Long Rest.</b> ${esc(t[0])}</p><p class="${b === "1" ? "" : "small"}"><b>After Long Rest.</b> ${esc(t[1])}</p></div></div>`;
  }
  if (kind === "trail") {
    const t = { name: a, cost: +b, rtype: c || null, up: true, start: a === LT.G_START.name };
    return `<div class="zoomview">${trailCard(t, 0, { reveal: true })}<div class="zt"><div class="label">Trail · Difficulty ${b}</div><h3>${esc(a)}</h3><p>${esc(LT.TERRAIN[a] || "No terrain rule.")}</p>
      <p class="small">${c ? (c === "dog" ? "Dog reward: end your Run here to take the dog." : "Gear reward: end your Run here to take the gear.") : "No reward."} Drafting: Difficulty is 1 less if another musher is on or past it${a === "Deep Powder" ? " (3 less here)" : ""}.</p></div></div>`;
  }
  if (kind === "cp") return `<div class="zoomview">${trailCard({ type: "CP", cp: +a }, 0)}<div class="zt"><div class="label">Checkpoint ${a} · Difficulty 1</div><h3>Checkpoint</h3><p>${esc(isG() ? G_CP_TEXT : LT.CP_TEXT)}</p><p class="small">Every musher takes exactly one Long Rest, at either checkpoint, and must take it before passing Checkpoint 2.</p></div></div>`;
  if (kind === "finish") return `<div class="zoomview">${trailCard({ type: "F" }, 0)}<div class="zt"><div class="label">Difficulty ${LT.FINISH_COST}</div><h3>Finish</h3><p>${esc(LT.FINISH_TEXT)}</p></div></div>`;
  if (kind === "back") return `<div class="zoomview">${backCard("trail")}<div class="zt"><h3>Face-down trail</h3><p>Flips when a musher moves onto the trail before it.</p></div></div>`;
  return "";
}

function rulesHTML() {
  const g = S.game;
  if ((g ? g.format : S.format) === "gangline") return `<h3>Long Trail · Gangline (prototype)</h3>
  <details class="rules" open><summary>Your turn</summary><ul>
    <li><b>Start:</b> your line is empty and your 3 starting dogs are in your hand. Trail 1 is always the Starting Chute, Difficulty 3.</li>
    <li>Your team stays on the table as your gangline, front to back, at most ${(g ? g.rules : S.rules).lineMax || 6} dogs. Dogs not in the line are in your hand.</li>
    <li><b>1. Hitch:</b> you may add one dog from your hand at the front or the back of your line.</li>
    <li><b>2. Go:</b> if your team's Speed is at least the next trail's Difficulty, move onto it. Your Lead dog (the front dog) tires: rested → tired → exhausted. Moving flips the next trail. Keep going while your weaker team still covers the next trail, or stop. Take the reward where you stop.</li>
    <li><b>2. or Camp:</b> every dog in your line recovers one step (exhausted → tired → rested). You may send dogs back to your hand.</li>
    <li><b>3. Event:</b> draw one Event after you Go or Camp (not after a checkpoint camp).</li></ul></details>
  <details class="rules"><summary>Speed</summary><ul>
    <li>Rested dogs give their Speed and ability. Tired dogs give their tired Speed and role bonus. Exhausted dogs give nothing, not even a Lead or Wheel bonus.</li>
    <li>Lead bonus +1 if a Lead dog is at the front, Wheel bonus +1 if a Wheel dog is at the back, with at least 2 dogs that aren't exhausted. Drafting: a trail's Difficulty is 1 less if another musher is on or past it.</li></ul></details>
  <details class="rules"><summary>Checkpoints</summary><ul>
    <li>Camp once per checkpoint: every dog rests, take the top dog and the top gear. No Event.</li>
    <li>Long Rest once per race (required before passing Checkpoint 2): every dog rests, used gear returns, take the top dog and the top gear, skip your next turn, then flip your musher. No Event.</li></ul></details>
  <div class="btns" style="margin-top:12px"><button class="primary" data-act="closeov">Close</button></div>`;
  const mode = g ? g.mode : S.mode, rules = g ? g.rules : S.rules, legs = g ? g.legs : S.legs;
  const gen = mode === "generous";
  const fl = [];
  if (!rules.noStorm) fl.push("Start your turn on a final-leg trail: draw an Event.");
  if (!rules.noHarsh) fl.push("<b>Harsh weather:</b> Events that drop a dog drop 2.");
  return `<h3>Long Trail · quick rules</h3>
  <p class="small">This race: ${legs.join("-")} trails${rules.lineMax ? ` · ${rules.lineMax}-dog gangline` : ""} · ${gen ? "well-stocked" : "standard"} checkpoints.</p>
  <details class="rules" open><summary>Your turn: Run, Slog or Camp</summary><ul>
    <li><b>Run:</b> line up rested dogs (hand) and/or tired dogs (in front of you)${rules.lineMax ? `, at most ${rules.lineMax} dogs` : ""}. Rested dogs use full Speed, ability and role bonus; tired dogs use tired Speed, role bonus and any ability printed on their tired half. Lead first +1 and Wheel last +1, as long as at least 2 dogs run.</li>
    <li>To move onto a trail, your Speed must cover its Difficulty; spend that much and keep going while you can. Drafting: a trail's Difficulty is 1 less if another musher is on or past it (Deep Powder: 3 less).</li>
    <li>After a Run, rested dogs that ran become tired, tired ones become exhausted. Then draw any River Ice Event, then draw 1 Event for each tired dog you pushed.</li>
    <li>If your Run ends on a trail with a reward (or stops at a checkpoint right after one), take it.</li>
    <li><b>Slog:</b> only when your rested and tired dogs together can't move onto the next trail. Move one trail with no dogs and draw an Event. Once per leg. No reward.</li>
    <li><b>Camp:</b> draw an Event first, then all tired and exhausted dogs return to your hand. Used gear stays used.</li></ul></details>
  <details class="rules"><summary>Checkpoints and the Long Rest</summary><ul>
    <li>Checkpoints have Difficulty 1. Move onto them like any trail; with Speed left after entering, you may stop or keep going. A Run that stops at a checkpoint may take the reward on the trail just before it.</li>
    <li>Camp once per checkpoint, no Event. Normal camp: dogs back, ${gen ? "draw 2 dogs" : "take 1 dog"}, take the top gear.</li>
    <li>Long Rest (exactly once, either checkpoint, required before passing Checkpoint 2): dogs and used gear back, ${gen ? "draw 3 dogs keep 2" : "draw 2 dogs keep 1"}, draw 2 gear keep 1, skip your next turn, then flip your musher.</li></ul></details>
  <details class="rules"><summary>Final leg and Events</summary><ul>
    ${fl.length ? fl.map(x => `<li>${x}</li>`).join("") : "<li>No extra final-leg weather in this race.</li>"}
    <li>Dropped dogs must be tired or exhausted if you have any. No dogs left: you're scratched.</li>
    <li>The Finish has Difficulty 2. First musher there wins.</li></ul></details>
  <details class="rules"><summary>Carry-over</summary><ul>
    <li>After a race the winner keeps 1 card, every other musher who finished keeps 2, and scratched mushers keep nothing. At most 1 gear.</li>
    <li>Kept cards fill part of your next starting hand of 3 dogs and 1 gear. Kept dogs can still be dropped.</li></ul></details>
  <div class="btns" style="margin-top:12px"><button class="primary" data-act="closeov">Close</button></div>`;
}

function artCheckHTML() {
  const names = [];
  LT.DOGS.forEach(d => names.push(["Dog", d[0], artFor(artKeys.dog({ name: d[0] }))]));
  LT.GEAR.forEach(x => names.push(["Gear", x[0], artFor(artKeys.gear({ name: x[0] }))]));
  LT.EVENTS.forEach(x => names.push(["Event", x[0], artFor(artKeys.event(x[0]))]));
  LT.MUSHER_NAMES.forEach(x => names.push(["Musher", x, artFor(artKeys.musher(x))]));
  LT.TRAILS.forEach(t => names.push(["Trail", `${t[0]} ${t[1]} ${t[2] || "none"}`, artFor(artKeys.trail({ name: t[0], cost: t[1], rtype: t[2] }))]));
  names.push(["Other", "Checkpoint 1", artFor(artKeys.cp(1))], ["Other", "Checkpoint 2", artFor(artKeys.cp(2))], ["Other", "Finish", artFor(artKeys.finish())]);
  const hit = names.filter(n => n[2]).length;
  const miss = names.filter(n => !n[2]);
  const used = new Set(names.map(n => n[2]).filter(Boolean));
  const base = dupStrip;
  const usedKeys = [...ART.files].filter(([, u]) => used.has(u)).map(([k]) => k);
  const usedBases = new Set([...usedKeys, ...usedKeys.map(base)]);
  const unused = [...ART.files].filter(([k, u]) => !used.has(u) && !/^back/.test(k) && k !== "trailback" && !usedBases.has(base(k))).map(([k]) => k);
  return `<h3>Card art matches</h3><p>${hit} of ${names.length} card images found. Extra copies of the same card share one image.</p>
    ${miss.length ? `<p class="small">No image found for: ${miss.map(n => `${n[0]} <b>${esc(n[1])}</b>`).join(", ")}.</p>` : ""}
    ${unused.length ? `<p class="small">Images that didn't match any card (names shown without spaces or capitals): ${unused.map(k => `<b>${esc(k)}</b>`).join(", ")}. Renaming one of these to the card's name fixes the match.</p>` : ""}
    <p class="small">Face-down trails ${artFor(artKeys.back("trail")) ? "use your trail back image." : "use the built-in striped back. If you design a card back later, put it in a folder with \"back\" in its name next to <i>fronts</i> and choose the parent folder."}</p>
    <div class="btns"><button class="primary" data-act="closeov">Close</button></div>`;
}

function ensureModalHost() { if (!$("#modal")) app.insertAdjacentHTML("beforeend", `<div id="modal"></div>`); }
const SIZES = { S: [120, 84], M: [150, 96], L: [190, 112] };
function applySize() {
  const [h, s] = SIZES[S.cardSize] || SIZES.M;

  const narrow = isNarrow();
  const vw = { S: 26, M: 31, L: 40 }[S.cardSize] || 31;
  document.documentElement.style.setProperty("--handw", narrow ? `min(${h}px, ${vw}vw)` : `min(${h}px, 40vw)`);
  document.documentElement.style.setProperty("--stripw", narrow ? `min(${s}px, ${vw - 13}vw)` : `min(${s}px, 19vw)`);
}

function wantPhone() {
  const pref = S.layout || "auto";
  if (pref === "phone") return true;
  if (pref === "desktop") return false;
  if (window.matchMedia("(max-width: 700px)").matches) return true;
  const touch = window.matchMedia("(pointer: coarse)").matches || window.matchMedia("(hover: none)").matches || (navigator.maxTouchPoints || 0) > 0;
  const mobileUA = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || "");
  const w = Math.min(window.innerWidth || 9999, (window.screen && window.screen.width) || 9999);
  return (touch || mobileUA) && w <= 1180;
}
function applyLayout() { document.documentElement.classList.toggle("phone", wantPhone()); }
const isNarrow = () => document.documentElement.classList.contains("phone");
// Keep the part of the trail where the action is in view on small screens.
function scrollStripToAction() {
  const box = $(".stripbox"), g = S.game; if (!box || !g) return;
  const p = g.current || S.viewer; if (!p) return;
  const slots = box.querySelectorAll(".slot");
  const el = slots[Math.max(0, p.pos + 1)]; if (!el) return;
  const key = g.round + ":" + p.idx + ":" + p.pos;
  if (box.dataset.k === key) return;
  box.dataset.k = key;
  box.scrollLeft = Math.max(0, el.offsetLeft - box.clientWidth * 0.3);
}
// Phone: a bar pinned to the bottom with the turn buttons, or need/have + Run! while setting up a Run.
function buildMobileBar() {
  const bar = $("#mobilebar"); if (!bar) return;
  const pd = S.pending, myTurn = pd && pd.req.type === "action" && !pd.p.bot;
  if (!isNarrow() || !myTurn) { bar.hidden = true; document.body.classList.remove("hasbar"); return; }
  let html = "";
  if (S.run) {
    const need = $(".summary .vs .col:first-child .big"), have = $(".summary .vs .col:nth-child(2) .big"), verdict = $(".summary .verdict");
    const go = $("#runpanel [data-act=go]");
    html = `<div class="mbsum"><span>Need <b>${need ? need.textContent : "–"}</b></span><span>Have <b class="${have ? have.className.replace("big", "") : ""}">${have ? have.textContent : "–"}</b></span><span class="mbv">${verdict ? verdict.innerHTML : ""}</span></div>
      <button data-act="cancelrun">Back</button><button class="primary" data-act="go" ${go && !go.disabled ? "" : "disabled"}>Run!</button>`;
  } else {
    const btns = [...document.querySelectorAll("#runpanel .acts > button.act")].filter(b => ["run", "slog", "camp", "cpcamp", "longrest", "ggo", "gcamp"].includes(b.dataset.act));
    html = btns.map(b => `<button class="${b.classList.contains("primary") ? "primary" : ""}" data-act="${b.dataset.act}" ${b.disabled ? "disabled" : ""}>${b.querySelector("b").textContent}</button>`).join("");
  }
  bar.innerHTML = html;
  bar.hidden = !html;
  document.body.classList.toggle("hasbar", !!html);
}
window.addEventListener("resize", () => { applySize(); if (S.screen === "game" && S.game) renderGame(); });

// ---------------- Events ----------------
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.k) { S.seats[+t.dataset.i][t.dataset.k] = t.value; store.set("seats", S.seats); }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.leg != null) { S.legs[+t.dataset.leg] = +t.value; store.set("legs", S.legs); renderSetup(); return; }
  if (t.name === "mode") { S.mode = t.value; store.set("mode", S.mode); }
  if (t.name === "format") { S.format = t.value; store.set("format", S.format); }
  if (t.id === "rule-line") { S.rules.lineMax = +t.value || 0; if (!S.rules.lineMax) delete S.rules.lineMax; store.set("rules", S.rules); }
  if (t.id === "rule-storm") { if (t.checked) delete S.rules.noStorm; else S.rules.noStorm = true; store.set("rules", S.rules); }
  if (t.id === "rule-harsh") { if (t.checked) delete S.rules.noHarsh; else S.rules.noHarsh = true; store.set("rules", S.rules); }
  if (t.id === "rule-vet") { if (t.checked) S.rules.vetCheck = true; else delete S.rules.vetCheck; store.set("rules", S.rules); }
  if (t.id === "rule-big") { if (t.checked) S.rules.bigLine = 5; else delete S.rules.bigLine; store.set("rules", S.rules); }
  if (S.screen === "setup" && (t.name === "mode" || /^rule-/.test(t.id || ""))) { renderSetup(); return; }
  if (t.id === "layoutsel" || t.id === "layoutsel2") { S.layout = t.value; store.set("layout", S.layout); applySize(); if (S.game && S.screen === "game") renderGame(true); }
  if (t.id === "botspeed" || t.id === "botspeed2") { S.botSpeed = +t.value; store.set("botSpeed", S.botSpeed); }
  if (t.id === "artpick" || t.id === "artpick2") {
    const n = useFiles(t.files, true);
    renderSetup();
    if (!n) { const s = $(".artstat"); if (s) s.textContent = "No images found in that selection."; }
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) {
    const z = e.target.closest("[data-zoom]");
    if (z && !z.closest(".zoomview")) { S.overlay = { type: "zoom", spec: z.dataset.zoom, prev: S.overlay }; ensureModalHost(); renderModal(); return; }
    if (e.target.classList && e.target.classList.contains("scrim") && S.overlay && S.overlay.type === "zoom") { S.overlay = S.overlay.prev || null; renderModal(); }
    return;
  }
  if (b.disabled) return;
  const act = b.dataset.act, g = S.game, pd = S.pending;
  const id = b.dataset.id;
  switch (act) {
    // setup
    case "ctl": S.seats[+b.dataset.i].bot = b.dataset.v === "b"; if (S.seats[+b.dataset.i].bot && !/^bot/i.test(S.seats[+b.dataset.i].name)) S.seats[+b.dataset.i].name = "Bot " + ["Kit", "Juno", "Moss", "Pike"][+b.dataset.i]; store.set("seats", S.seats); renderSetup(); break;
    case "seatup": case "seatdown": {
      const i = +b.dataset.i, j = act === "seatup" ? i - 1 : i + 1;
      if (j >= 0 && j < S.seats.length) { [S.seats[i], S.seats[j]] = [S.seats[j], S.seats[i]]; store.set("seats", S.seats); renderSetup(); }
      break;
    }
    case "addseat": if (S.seats.length < 4) { const i = S.seats.length; S.seats.push({ name: "Bot " + ["Kit", "Juno", "Moss", "Pike"][i], bot: true, musher: "Random" }); store.set("seats", S.seats); renderSetup(); } break;
    case "rmseat": if (S.seats.length > 2) { S.seats.splice(+b.dataset.i, 1); store.set("seats", S.seats); renderSetup(); } break;
    case "start": startGame(); break;
    case "resume": { const sv = savedRace(); if (sv) startGame(undefined, sv); break; }
    case "discardsave": clearSave(); renderSetup(); break;
    case "legreset": case "stdreset": resetToStandard(); renderSetup(); break;
    case "clearart": IDB.clear(); setArt([], ""); loadManifest().then(renderSetup); renderSetup(); break;
    case "artcheck": S.overlay = { type: "artcheck", html: artCheckHTML() }; if (S.screen === "setup") { app.insertAdjacentHTML("beforeend", `<div id="modal"></div>`); } renderModal(); break;
    // game header
    case "reloadlatest": reloadLatest(); break;
    case "checkupd": checkForUpdate(true); break;
    case "dismissupd": { const b = $("#updbanner"); if (b) b.remove(); break; }
    case "menu": { const t = $(".top"); if (t) t.classList.toggle("showtools"); break; }
    case "rules": S.overlay = { type: "rules" }; renderModal(); break;
    case "newrace": S.game = null; S.pending = null; S.overlay = null; S.carry = null; S.screen = "setup"; render(); break;
    case "rematch": { S.overlay = null; S.carry = null; startGame(); break; }
    case "carrypick": toggleCarry(+b.dataset.p, +b.dataset.o); renderModal(); break;
    case "clearkept": { const sd = S.seats[+b.dataset.i]; if (sd) { delete sd.kept; store.set("seats", S.seats); renderSetup(); } break; }
    case "clearallkept": S.seats.forEach(sd => delete sd.kept); store.set("seats", S.seats); renderSetup(); break;
    case "pause": if (S.game && !S.game.over) { if (T.pausedAt != null) { T.resume(); if (S.overlay && S.overlay.type === "paused") S.overlay = null; } else { T.pause(); S.overlay = { type: "paused" }; } tickClock(); renderModal(); } break;
    case "closeover": S.overlay = null; renderModal(); break;
    case "zoom": S.overlay = { type: "zoom", spec: b.dataset.z, prev: S.overlay }; ensureModalHost(); renderModal(); break;
    case "closezoom": S.overlay = S.overlay && S.overlay.prev || null; if (S.screen === "setup" && !S.overlay) { const m = $("#modal"); if (m) m.remove(); } else renderModal(); break;
    case "size": S.cardSize = b.dataset.v; store.set("cardSize", S.cardSize); applySize(); if (S.game) renderGame(true); break;
    case "closeov": S.overlay = null; if (S.screen === "setup") { const m = $("#modal"); if (m) m.remove(); } else renderModal(); break;
    case "passok": { const ov = S.overlay; S.overlay = null; ov.res(); break; }
    // actions
    case "run": S.run = { line: [], gear: new Set() }; renderGame(); break;
    case "cancelrun": S.run = null; renderGame(); break;
    case "clearline": if (S.run) { S.run.line = []; renderGame(); } break;
    case "adddog": if (S.run && !S.run.line.includes(id) && !(g.rules.lineMax && S.run.line.length >= g.rules.lineMax)) { S.run.line.push(id); renderGame(); } break;
    case "rmdog": if (S.run) { S.run.line = S.run.line.filter(x => x !== id); renderGame(); } break;
    case "mv": if (S.run) { const L = S.run.line, i = L.indexOf(id), j = i + +b.dataset.d; if (j >= 0 && j < L.length) { [L[i], L[j]] = [L[j], L[i]]; renderGame(); } } break;
    case "togglegear": if (S.run) { S.run.gear.has(id) ? S.run.gear.delete(id) : S.run.gear.add(id); renderGame(); } break;
    case "autoline": if (S.run && pd) {
      const p = pd.p;
      const all = [...g.rested(p)].map(d => ({ dog: d, st: "rested" }));
      let line = LT.Bot.arrange(all);
      const pv = g.preview(p, line, [], { stopAtHidden: true });
      if (!pv.crossed) { line = LT.Bot.arrange(all.concat(g.tired(p).map(d => ({ dog: d, st: "tired" })))); }
      if (g.rules.lineMax) {
        const pick = LT.Bot.arrange(all).sort((a, b) => (b.dog.rs + (b.dog.role !== "Team" ? 1 : 0)) - (a.dog.rs + (a.dog.role !== "Team" ? 1 : 0))).slice(0, g.rules.lineMax);
        line = LT.Bot.arrange(pick);
      }
      S.run.line = line.map(x => x.dog.id); renderGame();
    } break;
    case "go": if (S.run && pd) resolvePending({ type: "run", line: S.run.line.map(x => ({ id: x })), gear: [...S.run.gear] }); break;
    case "slog": if (pd) { const c = $("#uselantern"); resolvePending({ type: "slog", lantern: c ? c.checked : false }); } break;
    case "camp": if (pd) { const c = $("#usebivy"); resolvePending({ type: "camp", bivy: c ? c.checked : false }); } break;
    case "cpcamp": if (pd) { S.g = null; resolvePending({ type: "cp", long: false }); } break;
    case "gsel": { const st = gState(); st.sel = st.sel === id ? null : id; renderGame(); break; }
    case "ghitch": if (pd) { const st = gState(); const sel = st.sel; st.sel = null; if (sel) resolvePending({ type: "hitch", id: sel, end: b.dataset.v }); } break;
    case "ggear": { const st = gState(); if (st.gear.has(id)) st.gear.delete(id); else st.gear.add(id); renderGame(); break; }
    case "gret": { const st = gState(); if (st.ret.has(id)) st.ret.delete(id); else st.ret.add(id); renderGame(); break; }
    case "ggo": if (pd) { const st = gState(); S.g = null; resolvePending({ type: "go", gear: [...st.gear] }); } break;
    case "gcamp": if (pd) { const st = gState(); const c = $("#usebivy"); S.g = null; resolvePending({ type: "camp", ret: [...st.ret], bivy: c ? c.checked : false }); } break;
    case "longrest": if (pd) { S.g = null; resolvePending({ type: "cp", long: true }); } break;
    case "usegear": if (pd) {
      if (S.overlay && S.overlay.type === "zoom") S.overlay = null;
      if (S.run) S.keepRun = { line: S.run.line.slice(), gear: new Set(S.run.gear) };
      const p = pd.p, gr = p.gear.find(x => x.id === id);
      if (!gr) break;
      if (gr.name === "Dog Food" || gr.name === "Whistle") {
        const opts = gr.name === "Dog Food" ? g.exh(p) : g.tired(p);
        if (opts.length === 1) resolvePending({ type: "gear", gear: id, target: opts[0].id });
        else { S.overlay = { type: "freepick", p, gear: gr, options: opts }; renderModal(); }
      } else resolvePending({ type: "gear", gear: id });
    } break;
    case "freepickdog": { const ov = S.overlay; S.overlay = null; resolvePending({ type: "gear", gear: ov.gear.id, target: id }); break; }
    // modal answers
    case "ok": resolvePending(true); break;
    case "pick": if (pd) {
      const v = b.dataset.v, t = pd.req.type;
      if (t === "pickEvent") resolvePending(+v);
      else if (t === "rookieIgnore" || t === "sledBasket" || t === "stopAtCP" || t === "alpineIgnore" || t === "gContinue") resolvePending(v === "1");
      else resolvePending(v);
    } break;
    case "keeptoggle": if (pd) {
      const sel = S.keepSel || (S.keepSel = new Set());
      if (sel.has(id)) sel.delete(id); else if (sel.size < pd.req.keep) sel.add(id);
      renderModal();
    } break;
    case "keepok": if (pd) { const v = [...(S.keepSel || [])]; S.keepSel = null; resolvePending(v); } break;
  }
});
document.addEventListener("dragstart", e => {
  const z = e.target.closest && e.target.closest("[data-drag]");
  if (!z) return;
  S.dragId = z.dataset.drag; z.classList.add("dragging");
  try { e.dataTransfer.setData("text/plain", S.dragId); e.dataTransfer.effectAllowed = "move"; } catch {}
});
document.addEventListener("dragover", e => {
  const z = e.target.closest && e.target.closest("[data-drag]");
  if (!z || !S.dragId) return;
  e.preventDefault();
  document.querySelectorAll(".zz.over").forEach(x => x !== z && x.classList.remove("over"));
  z.classList.add("over");
});
document.addEventListener("drop", e => {
  const z = e.target.closest && e.target.closest("[data-drag]");
  if (!z || !S.dragId || !S.run) return;
  e.preventDefault();
  const L = S.run.line, from = L.indexOf(S.dragId), to = L.indexOf(z.dataset.drag);
  if (from >= 0 && to >= 0 && from !== to) { L.splice(to, 0, L.splice(from, 1)[0]); }
  S.dragId = null; renderGame();
});
document.addEventListener("dragend", () => { S.dragId = null; document.querySelectorAll(".dragging,.over").forEach(x => x.classList.remove("dragging", "over")); });
document.addEventListener("toggle", e => { if (e.target && e.target.id === "logwrap") store.set("logOpen", e.target.open); }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.overlay && S.overlay.type === "zoom") { S.overlay = S.overlay.prev || null; if (S.screen === "setup" && !S.overlay) { const m = $("#modal"); if (m) m.remove(); } else renderModal(); return; }
  if (e.key === "Escape" && S.overlay && (S.overlay.type === "rules" || S.overlay.type === "freepick" || S.overlay.type === "artcheck")) { S.overlay = null; renderModal(); }
});

// ---------------- Updates (for the GitHub Pages copy) ----------------
const LT_BUILD = "Oct 15, 10:58 PM";
const onWeb = /github\.io$/i.test(location.hostname);
function reloadLatest() { location.replace(location.pathname + "?v=" + Date.now()); }
async function checkForUpdate(manual) {
  if (!onWeb) return;
  try {
    const r = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const t = await r.text();
    const m = t.match(/const LT_BUILD = "([^"]+)"/);
    if (m && m[1] !== LT_BUILD) showUpdateBanner(m[1]);
    else if (manual) showUpdateBanner(null);
  } catch { if (manual) reloadLatest(); }
}
function showUpdateBanner(newer) {
  let b = $("#updbanner");
  if (!b) { b = document.createElement("div"); b.id = "updbanner"; b.className = "updbanner"; document.body.appendChild(b); }
  b.innerHTML = newer
    ? `<span>A newer version is ready (build ${esc(newer)}).</span><button class="primary" data-act="reloadlatest">Update now</button><button data-act="dismissupd" aria-label="Dismiss">✕</button>`
    : `<span>You have the latest version (build ${esc(LT_BUILD)}).</span><button data-act="dismissupd" aria-label="Dismiss">OK</button>`;
}
setInterval(() => { if (!S.game || S.game.over) checkForUpdate(false); }, 5 * 60 * 1000);

// ---------------- Boot ----------------
(async () => {
  applySize();
  render();
  const had = await restoreFiles();
  if (!had) await loadManifest();
  if (S.screen === "setup") renderSetup();
  checkForUpdate(false);
})();
window.__LT = S;
})();
